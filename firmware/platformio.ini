; Tracker GPS moto — LILYGO T-SIM7000G (ESP32-WROVER-B + SIM7000G)
;
; Deux programmes dans le même projet :
;   gps_test  -> étape 1 : allume le GNSS et affiche la position sur le port série
;   tracker   -> étape 2 : envoie les positions en HTTP vers le backend
;
; Exemples :
;   pio run -e gps_test -t upload -t monitor
;   pio run -e tracker  -t upload -t monitor

[platformio]
default_envs = gps_test

[env]
platform = espressif32
board = esp-wrover-kit
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DTINY_GSM_MODEM_SIM7000
    -DTINY_GSM_RX_BUFFER=1024
lib_deps =
    vshymanskyy/TinyGSM @ ^0.12.0
    arduino-libraries/ArduinoHttpClient @ ^0.6.1

[env:gps_test]
build_src_filter = +<gps_test.cpp> +<board.cpp>

[env:tracker]
build_src_filter = +<tracker.cpp> +<board.cpp>
