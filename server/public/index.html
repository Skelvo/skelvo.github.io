<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111418">
  <meta name="robots" content="noindex, nofollow">
  <title>Ma moto</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <section id="panel" class="card">
    <header class="panel-head">
      <h1>Ma moto</h1>
      <span id="badge" class="badge">…</span>
    </header>

    <div id="view-live">
      <p id="ago" class="big">Chargement…</p>
      <dl class="stats">
        <div><dt>Vitesse</dt><dd id="s-speed">–</dd></div>
        <div><dt>Satellites</dt><dd id="s-sats">–</dd></div>
        <div><dt>Batterie</dt><dd id="s-bat">–</dd></div>
        <div><dt>Signal</dt><dd id="s-csq">–</dd></div>
      </dl>
      <p id="seen" class="muted"></p>
      <div class="actions">
        <button id="btn-center" type="button">Centrer</button>
        <a id="btn-go" class="button" target="_blank" rel="noopener">Y aller</a>
        <button id="btn-trips" type="button">Trajets</button>
      </div>
    </div>

    <div id="view-trips" hidden>
      <div class="actions">
        <button id="btn-back" type="button">← Position actuelle</button>
      </div>
      <ul id="trips" class="trips"></ul>
      <div id="replay" hidden>
        <p id="r-info" class="muted"></p>
        <input id="r-slider" type="range" min="0" max="0" value="0">
        <div class="actions">
          <button id="r-play" type="button">▶ Rejouer</button>
          <select id="r-speed" aria-label="Vitesse de lecture">
            <option value="10">×10</option>
            <option value="30" selected>×30</option>
            <option value="100">×100</option>
          </select>
        </div>
      </div>
    </div>
  </section>

  <dialog id="login">
    <form method="dialog" id="login-form">
      <h2>Clé d'accès</h2>
      <p class="muted">La clé de lecture (READ_KEY) définie sur le serveur.</p>
      <input id="login-key" type="password" autocomplete="current-password" required>
      <p id="login-error" class="error" hidden>Clé refusée.</p>
      <button type="submit">Valider</button>
    </form>
  </dialog>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
