<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>Apéro — jeux de soirée</title>
<meta name="description" content="Jeux de soirée et d'apéro gratuits, sans pub, sur un seul téléphone : Action ou Vérité, Je n'ai jamais, L'Imposteur, La Bombe…" />
<meta name="robots" content="noindex">
<meta name="theme-color" content="#120d1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Apéro">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#120d1f;
  --bg-2:#1b1430;
  --panel:#221a3b;
  --panel-2:#2c2249;
  --line:rgba(255,255,255,.09);
  --text:#f6f1ff;
  --muted:#a99fc4;
  --accent:#ff5c8a;
  --accent-2:#ffb547;
  --ok:#3ddc97;
  --danger:#ff4d4d;
  --radius:22px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  background-image:
    radial-gradient(60rem 40rem at 110% -10%, rgba(255,92,138,.18), transparent 60%),
    radial-gradient(50rem 40rem at -20% 110%, rgba(110,80,255,.20), transparent 60%);
  background-attachment:fixed;
  color:var(--text);
  font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
  user-select:none;-webkit-user-select:none;
}
button,input,textarea,select{font:inherit;color:inherit;}
button{cursor:pointer;border:0;background:none;}
#app{
  max-width:560px;margin:0 auto;min-height:100%;
  padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 24px);
  display:flex;flex-direction:column;
}

/* ---------- Header ---------- */
.top{display:flex;align-items:center;gap:12px;min-height:48px;margin-bottom:10px;}
.top h1{font-size:1.25rem;margin:0;font-weight:800;flex:1;letter-spacing:-.01em;}
.icon-btn{
  width:44px;height:44px;border-radius:14px;background:var(--panel);
  display:grid;place-items:center;font-size:1.2rem;flex:none;
  border:1px solid var(--line);
}
.icon-btn:active{transform:scale(.94);}

/* ---------- Home ---------- */
.brand{display:flex;align-items:center;gap:12px;margin:6px 0 18px;}
.brand .logo{width:52px;height:52px;border-radius:16px;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:grid;place-items:center;font-size:1.7rem;box-shadow:0 10px 30px -10px rgba(255,92,138,.7);}
.brand h1{margin:0;font-size:2rem;font-weight:800;letter-spacing:-.03em;line-height:1;}
.brand p{margin:4px 0 0;color:var(--muted);font-size:.92rem;}

.section{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
.section h2{margin:0 0 12px;font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;}
.add-row{display:flex;gap:8px;}
.add-row input{
  flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;font-size:1rem;outline:none;user-select:text;-webkit-user-select:text;
}
.add-row input:focus{border-color:var(--accent);}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 18px;border-radius:16px;font-weight:700;font-size:1.02rem;
  background:var(--panel-2);border:1px solid var(--line);transition:transform .08s;
}
.btn:active{transform:scale(.97);}
.btn.primary{background:linear-gradient(135deg,var(--accent),#ff7a6b);border:0;color:#fff;box-shadow:0 12px 30px -12px rgba(255,92,138,.8);}
.btn.ok{background:var(--ok);color:#06281a;border:0;}
.btn.block{width:100%;}
.btn.big{padding:20px;font-size:1.2rem;border-radius:20px;}
.btn:disabled{opacity:.4;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:8px 8px 8px 14px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);font-weight:500;
}
.chip button{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.08);font-size:.8rem;display:grid;place-items:center;}
.empty{color:var(--muted);font-size:.9rem;margin:12px 0 0;}

.toggle{display:flex;align-items:center;gap:12px;padding:10px 0;}
.toggle + .toggle{border-top:1px solid var(--line);}
.toggle .t{flex:1;}
.toggle .t b{display:block;font-weight:700;}
.toggle .t span{color:var(--muted);font-size:.85rem;}
.switch{width:52px;height:32px;border-radius:999px;background:var(--panel-2);position:relative;flex:none;transition:background .2s;border:1px solid var(--line);}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;}
.switch.on{background:var(--accent);}
.switch.on::after{transform:translateX(20px);}

.games{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.game{
  position:relative;text-align:left;padding:16px 14px 14px;border-radius:var(--radius);
  min-height:138px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;
  background:var(--g);color:#fff;box-shadow:0 14px 30px -18px rgba(0,0,0,.8);
}
.game:active{transform:scale(.97);}
.game .e{position:absolute;top:10px;right:12px;font-size:2.3rem;filter:drop-shadow(0 4px 8px rgba(0,0,0,.25));}
.game b{font-size:1.12rem;font-weight:800;line-height:1.1;letter-spacing:-.01em;}
.game span{font-size:.8rem;opacity:.85;margin-top:4px;line-height:1.25;}
.game.wide{grid-column:1/-1;min-height:96px;}

h3.cat{margin:18px 2px 10px;font-size:1rem;font-weight:800;letter-spacing:-.01em;}
.nfilter{display:flex;align-items:center;gap:6px;margin:4px 0 0;}
.nfilter span{color:var(--muted);font-weight:700;font-size:.85rem;margin-right:auto;text-transform:uppercase;letter-spacing:.1em;}
.nfilter button{min-width:52px;padding:9px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:800;color:var(--muted);}
.nfilter button.on{background:var(--text);color:var(--bg);border-color:var(--text);}
.game.off{filter:grayscale(1);opacity:.4;}
.game .new{position:absolute;top:12px;left:12px;font-style:normal;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;background:rgba(255,255,255,.92);color:#2a1840;padding:4px 8px;border-radius:999px;}
.winners{display:flex;flex-direction:column;gap:8px;}
.opt.answer .letter{width:30px;height:30px;border-radius:9px;background:var(--panel-2);display:grid;place-items:center;font-weight:800;flex:none;}
.opt.answer.on .letter{background:var(--accent);}
.opt.dim{opacity:.35;}
.rules h3 small{font-size:.75rem;color:var(--muted);font-weight:600;margin-left:6px;}
.links{display:flex;gap:10px;margin-top:16px;}
.links .btn{flex:1;font-size:.95rem;}
.foot{text-align:center;color:var(--muted);font-size:.78rem;margin-top:18px;opacity:.7;}

/* ---------- Game screens ---------- */
.stage{flex:1;display:flex;flex-direction:column;gap:14px;}
.turn{text-align:center;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.8rem;margin-top:4px;}
.turn strong{display:block;color:var(--text);font-size:2rem;letter-spacing:-.02em;text-transform:none;margin-top:4px;font-weight:800;}
.card{
  flex:1;min-height:300px;border-radius:28px;padding:28px 24px;
  background:var(--g, linear-gradient(160deg,#2c2249,#221a3b));
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
  box-shadow:0 30px 60px -30px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.12);
  position:relative;overflow:hidden;
  animation:pop .32s cubic-bezier(.2,.9,.3,1.3);
}
.card .tag{position:absolute;top:18px;left:0;right:0;font-size:.78rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;opacity:.8;}
.card .txt{font-size:clamp(1.45rem,6.4vw,2.1rem);font-weight:700;line-height:1.18;letter-spacing:-.01em;text-wrap:balance;}
.card .sub{margin-top:18px;font-size:.95rem;opacity:.85;}
.card .count{position:absolute;bottom:16px;left:0;right:0;font-size:.8rem;opacity:.6;}
@keyframes pop{from{transform:scale(.92) translateY(12px);opacity:0}to{transform:none;opacity:1}}
.hint{text-align:center;color:var(--muted);font-size:.92rem;margin:0;}
.row{display:flex;gap:10px;}
.row > *{flex:1;}

.choice{
  flex:1;border-radius:28px;font-size:1.9rem;font-weight:800;color:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;min-height:150px;letter-spacing:-.02em;
}
.choice small{font-size:.9rem;font-weight:500;opacity:.85;letter-spacing:0;}
.choice:active{transform:scale(.97);}

.wyr{flex:1;display:flex;flex-direction:column;gap:12px;position:relative;}
.wyr button{
  flex:1;border-radius:28px;padding:24px;font-size:clamp(1.25rem,5.6vw,1.7rem);font-weight:700;color:#fff;line-height:1.2;
  transition:transform .15s, opacity .2s, outline-color .2s;outline:4px solid transparent;outline-offset:-4px;
  animation:pop .32s cubic-bezier(.2,.9,.3,1.3);text-wrap:balance;
}
.wyr button.sel{outline-color:#fff;transform:scale(1.02);}
.wyr button.dim{opacity:.4;}
.wyr .or{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;
  background:var(--bg);display:grid;place-items:center;font-weight:800;border:4px solid var(--bg-2);z-index:2;pointer-events:none;}

.big-num{font-size:9rem;font-weight:800;line-height:1;animation:pop .3s;}

/* Imposteur */
.reveal{display:flex;flex-direction:column;gap:14px;flex:1;}
.secret{font-size:clamp(2rem,10vw,3.2rem);font-weight:800;letter-spacing:-.02em;}
.opts{display:flex;flex-direction:column;gap:8px;}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--panel);border:2px solid transparent;text-align:left;}
.opt.on{border-color:var(--accent);background:var(--panel-2);}
.opt .r{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);flex:none;}
.opt.on .r{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 45%,transparent 50%);}
.opt b{display:block;}
.opt span{color:var(--muted);font-size:.85rem;}
.seg{display:flex;background:var(--panel);border-radius:14px;padding:4px;gap:4px;}
.seg button{flex:1;padding:10px;border-radius:10px;font-weight:700;color:var(--muted);}
.seg button.on{background:var(--panel-2);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.3);}
.label{font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700;margin:6px 0 -4px;}

/* Timer */
.timer{height:10px;border-radius:999px;background:var(--panel);overflow:hidden;}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--accent-2),var(--accent));transform-origin:left;}
.clock{font-size:3.4rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}

/* Scores */
.scores{display:flex;flex-direction:column;gap:6px;}
.score{display:flex;justify-content:space-between;padding:12px 16px;border-radius:14px;background:var(--panel);font-weight:700;}
.score.lead{background:linear-gradient(135deg,rgba(255,181,71,.3),rgba(255,92,138,.25));}
.found{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
.found span{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.12);font-size:.9rem;}
.found span.x{opacity:.45;text-decoration:line-through;}

/* Bombe */
.bomb{font-size:9rem;line-height:1;display:inline-block;filter:drop-shadow(0 20px 30px rgba(0,0,0,.5));}
.bomb.tick{animation:tick var(--spd,1s) infinite;}
@keyframes tick{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.12) rotate(4deg)}}
.flash{animation:flash .6s 3;}
@keyframes flash{0%,100%{background:var(--bg)}50%{background:#ff2e2e}}
.shake{animation:shake .5s;}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-10px,4px)}40%{transform:translate(10px,-6px)}60%{transform:translate(-8px,6px)}80%{transform:translate(6px,-4px)}}

/* Roue */
.wheel-name{font-size:clamp(2.4rem,12vw,4rem);font-weight:800;letter-spacing:-.03em;transition:color .1s;}
.wheel-name.final{animation:pop .4s cubic-bezier(.2,.9,.3,1.6);color:var(--accent-2);}

/* Mes cartes */
textarea{
  width:100%;min-height:220px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;
  font-size:1rem;line-height:1.45;resize:vertical;outline:none;user-select:text;-webkit-user-select:text;
}
textarea:focus{border-color:var(--accent);}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tabs button{flex:none;padding:9px 14px;border-radius:999px;background:var(--panel);font-weight:700;font-size:.9rem;color:var(--muted);border:1px solid var(--line);}
.tabs button.on{background:var(--text);color:var(--bg);}

.rules h3{margin:18px 0 6px;font-size:1.1rem;}
.rules p{margin:0;color:var(--muted);line-height:1.5;font-size:.95rem;}

.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 24px);transform:translateX(-50%);background:var(--text);color:var(--bg);
  padding:12px 18px;border-radius:14px;font-weight:700;z-index:50;animation:pop .25s;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:90vw;text-align:center;}

/* Fenêtre de mise à jour */
.upd{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:24px;background:rgba(8,5,16,.72);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .2s;}
.upd .box{width:100%;max-width:340px;background:var(--bg-2);border:1px solid var(--line);border-radius:26px;padding:26px 22px 18px;text-align:center;
  box-shadow:0 30px 60px rgba(0,0,0,.6);animation:pop .35s cubic-bezier(.2,.9,.3,1.3);}
.upd .ico{width:64px;height:64px;margin:0 auto 12px;border-radius:20px;display:grid;place-items:center;font-size:2rem;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 10px 30px -10px rgba(255,92,138,.8);}
.upd h3{margin:0 0 6px;font-size:1.35rem;font-weight:800;letter-spacing:-.01em;}
.upd p{margin:0 0 18px;color:var(--muted);line-height:1.45;font-size:.95rem;}
.upd .later{margin-top:6px;width:100%;padding:12px;color:var(--muted);font-weight:700;}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---------- Mode en ligne ---------- */
.online-cta{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border-radius:var(--radius);margin:4px 0 14px;
  background:linear-gradient(120deg,#2b2152,#3a1d4a);border:1px solid rgba(255,255,255,.14);box-shadow:0 14px 30px -18px rgba(0,0,0,.8);}
.online-cta .e{font-size:2rem;}
.online-cta b{display:block;font-size:1.1rem;font-weight:800;}
.online-cta small{color:var(--muted);font-size:.85rem;}
.online-cta .go{margin-left:auto;font-size:1.8rem;color:var(--muted);}
.online-cta:active{transform:scale(.98);}
.errbox{margin:0;padding:12px 14px;border-radius:14px;background:rgba(255,77,77,.14);border:1px solid rgba(255,77,77,.4);color:#ffc9c9;font-size:.92rem;line-height:1.4;}
.or-sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;font-weight:700;}
.or-sep::before,.or-sep::after{content:"";flex:1;height:1px;background:var(--line);}
.codein{text-transform:uppercase;letter-spacing:.3em;font-weight:800;text-align:center;font-size:1.2rem!important;}
.spinner{width:46px;height:46px;border-radius:50%;border:4px solid var(--panel-2);border-top-color:var(--accent);animation:spin .8s linear infinite;margin:0 auto 10px;}
.spinner.small{width:18px;height:18px;border-width:3px;margin:0;display:inline-block;vertical-align:-3px;}
@keyframes spin{to{transform:rotate(360deg)}}
.room-code{font-weight:800;letter-spacing:.18em;background:var(--panel);border:1px solid var(--line);padding:8px 10px;border-radius:12px;font-size:.9rem;}
.codecard{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px;border-radius:var(--radius);background:var(--bg-2);border:1px solid var(--line);}
.codecard span{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;font-weight:700;}
.codecard b{font-size:3.4rem;letter-spacing:.2em;font-weight:800;line-height:1.1;padding-left:.2em;}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block;}
.chip.offline{opacity:.5;}
.chip.offline .dot{background:var(--muted);}
.waiting{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--muted);padding:16px;border-radius:16px;background:var(--bg-2);border:1px dashed var(--line);text-align:center;}
.btn.ghost{background:none;border:0;color:var(--muted);font-size:.85rem;font-weight:600;padding:8px;}
.secret.blur{filter:blur(14px);}
.hideable{cursor:pointer;}

.seats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px;}
.seats::-webkit-scrollbar{display:none;}
.seat{flex:1 0 auto;min-width:80px;padding:8px 10px;border-radius:14px;background:var(--panel);border:2px solid transparent;text-align:center;}
.seat b{display:block;font-size:.88rem;white-space:nowrap;}
.seat span{font-size:.78rem;color:var(--muted);}
.seat em{display:block;font-style:normal;font-size:.68rem;color:var(--accent-2);font-weight:700;}
.seat.now{border-color:var(--accent);background:var(--panel-2);}
.seat.done{opacity:.55;}
.table{min-height:150px;border-radius:28px;background:radial-gradient(ellipse at center,#1d6b4a,#0f3d2b);border:6px solid #3a2a1a;box-shadow:inset 0 0 30px rgba(0,0,0,.5);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;}
.table small{color:rgba(255,255,255,.75);font-weight:600;}
.pile{display:flex;gap:6px;animation:pop .3s;}
.log{text-align:center;margin:0;font-weight:700;font-size:.95rem;}
.exch{margin:0;text-align:center;font-size:.85rem;color:var(--accent-2);}
.turnbar{text-align:center;padding:10px;border-radius:14px;background:var(--panel);color:var(--muted);font-weight:700;}
.turnbar.mine{background:linear-gradient(135deg,var(--accent),#ff7a6b);color:#fff;animation:pop .3s;}
.hand{display:flex;flex-wrap:wrap;justify-content:center;padding:14px 0 0 22px;}
.cardbtn{margin:0 0 10px -22px;padding:0;}
.pc{width:50px;height:72px;border-radius:9px;background:#fffdf8;color:#16131c;display:flex;flex-direction:column;align-items:flex-start;padding:5px 6px;
  box-shadow:-3px 2px 6px rgba(0,0,0,.35);border:1px solid rgba(0,0,0,.12);line-height:1;transition:transform .12s;font-family:inherit;}
.pc b{font-size:1.1rem;font-weight:800;}
.pc i{font-style:normal;font-size:1.25rem;}
.pc.red{color:#d42b3a;}
.pc.sel{transform:translateY(-14px);box-shadow:0 0 0 3px var(--accent),0 10px 20px rgba(0,0,0,.4);}
.pc.big{width:62px;height:88px;padding:7px 8px;}
.pc.big b{font-size:1.4rem;} .pc.big i{font-size:1.6rem;}
.ranking{display:flex;flex-direction:column;gap:8px;width:100%;}
.ranking div{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:rgba(0,0,0,.2);text-align:left;}
.ranking span{opacity:.7;font-weight:700;width:22px;}
.ranking b{flex:1;font-size:1.1rem;}
.ranking em{font-style:normal;font-weight:700;font-size:.9rem;}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important;}}
</style>
</head>
<body>
<div id="app"></div>
<script src="data.js?v=4"></script>
<script src="app.js?v=4"></script>
<script src="online.js?v=4"></script>
</body>
</html>
