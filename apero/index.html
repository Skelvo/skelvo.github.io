<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>Apéro — jeux de soirée</title>
<meta name="description" content="Jeux de soirée et d'apéro gratuits, sans pub, sur un seul téléphone : Action ou Vérité, Je n'ai jamais, L'Imposteur, La Bombe…" />
<meta name="robots" content="noindex">
<meta name="theme-color" content="#120d1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Apéro">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#120d1f;
  --bg-2:#1b1430;
  --panel:#221a3b;
  --panel-2:#2c2249;
  --line:rgba(255,255,255,.09);
  --text:#f6f1ff;
  --muted:#a99fc4;
  --accent:#ff5c8a;
  --accent-2:#ffb547;
  --ok:#3ddc97;
  --danger:#ff4d4d;
  --radius:22px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  background-image:
    radial-gradient(60rem 40rem at 110% -10%, rgba(255,92,138,.18), transparent 60%),
    radial-gradient(50rem 40rem at -20% 110%, rgba(110,80,255,.20), transparent 60%);
  background-attachment:fixed;
  color:var(--text);
  font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
  user-select:none;-webkit-user-select:none;
}
button,input,textarea,select{font:inherit;color:inherit;}
button{cursor:pointer;border:0;background:none;}
#app{
  max-width:560px;margin:0 auto;min-height:100%;
  padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 24px);
  display:flex;flex-direction:column;
}

/* ---------- Header ---------- */
.top{display:flex;align-items:center;gap:12px;min-height:48px;margin-bottom:10px;}
.top h1{font-size:1.25rem;margin:0;font-weight:800;flex:1;letter-spacing:-.01em;}
.icon-btn{
  width:44px;height:44px;border-radius:14px;background:var(--panel);
  display:grid;place-items:center;font-size:1.2rem;flex:none;
  border:1px solid var(--line);
}
.icon-btn:active{transform:scale(.94);}

/* ---------- Home ---------- */
.brand{display:flex;align-items:center;gap:12px;margin:6px 0 18px;}
.brand .logo{width:52px;height:52px;border-radius:16px;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:grid;place-items:center;font-size:1.7rem;box-shadow:0 10px 30px -10px rgba(255,92,138,.7);}
.brand h1{margin:0;font-size:2rem;font-weight:800;letter-spacing:-.03em;line-height:1;}
.brand p{margin:4px 0 0;color:var(--muted);font-size:.92rem;}

.section{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
.section h2{margin:0 0 12px;font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;}
.add-row{display:flex;gap:8px;}
.add-row input{
  flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;font-size:1rem;outline:none;user-select:text;-webkit-user-select:text;
}
.add-row input:focus{border-color:var(--accent);}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 18px;border-radius:16px;font-weight:700;font-size:1.02rem;
  background:var(--panel-2);border:1px solid var(--line);transition:transform .08s;
}
.btn:active{transform:scale(.97);}
.btn.primary{background:linear-gradient(135deg,var(--accent),#ff7a6b);border:0;color:#fff;box-shadow:0 12px 30px -12px rgba(255,92,138,.8);}
.btn.ok{background:var(--ok);color:#06281a;border:0;}
.btn.block{width:100%;}
.btn.big{padding:20px;font-size:1.2rem;border-radius:20px;}
.btn:disabled{opacity:.4;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:8px 8px 8px 14px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);font-weight:500;
}
.chip button{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.08);font-size:.8rem;display:grid;place-items:center;}
.empty{color:var(--muted);font-size:.9rem;margin:12px 0 0;}

.toggle{display:flex;align-items:center;gap:12px;padding:10px 0;}
.toggle + .toggle{border-top:1px solid var(--line);}
.toggle .t{flex:1;}
.toggle .t b{display:block;font-weight:700;}
.toggle .t span{color:var(--muted);font-size:.85rem;}
.switch{width:52px;height:32px;border-radius:999px;background:var(--panel-2);position:relative;flex:none;transition:background .2s;border:1px solid var(--line);}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;}
.switch.on{background:var(--accent);}
.switch.on::after{transform:translateX(20px);}

.games{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.game{
  position:relative;text-align:left;padding:16px 14px 14px;border-radius:var(--radius);
  min-height:138px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;
  background:var(--g);color:#fff;box-shadow:0 14px 30px -18px rgba(0,0,0,.8);
}
.game:active{transform:scale(.97);}
.game .e{position:absolute;top:10px;right:12px;font-size:2.3rem;filter:drop-shadow(0 4px 8px rgba(0,0,0,.25));}
.game b{font-size:1.12rem;font-weight:800;line-height:1.1;letter-spacing:-.01em;}
.game span{font-size:.8rem;opacity:.85;margin-top:4px;line-height:1.25;}
.game.wide{grid-column:1/-1;min-height:96px;}

h3.cat{margin:18px 2px 10px;font-size:1rem;font-weight:800;letter-spacing:-.01em;}
.nfilter{display:flex;align-items:center;gap:6px;margin:4px 0 0;}
.nfilter span{color:var(--muted);font-weight:700;font-size:.85rem;margin-right:auto;text-transform:uppercase;letter-spacing:.1em;}
.nfilter button{min-width:52px;padding:9px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:800;color:var(--muted);}
.nfilter button.on{background:var(--text);color:var(--bg);border-color:var(--text);}
.game.off{filter:grayscale(1);opacity:.4;}
.game .new{position:absolute;top:12px;left:12px;font-style:normal;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;background:rgba(255,255,255,.92);color:#2a1840;padding:4px 8px;border-radius:999px;}
.winners{display:flex;flex-direction:column;gap:8px;}
.opt.answer .letter{width:30px;height:30px;border-radius:9px;background:var(--panel-2);display:grid;place-items:center;font-weight:800;flex:none;}
.opt.answer.on .letter{background:var(--accent);}
.opt.dim{opacity:.35;}
.rules h3 small{font-size:.75rem;color:var(--muted);font-weight:600;margin-left:6px;}
.links{display:flex;gap:10px;margin-top:16px;}
.links .btn{flex:1;font-size:.95rem;}
.foot{text-align:center;color:var(--muted);font-size:.78rem;margin-top:18px;opacity:.7;}

/* ---------- Game screens ---------- */
.stage{flex:1;display:flex;flex-direction:column;gap:14px;}
.turn{text-align:center;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.8rem;margin-top:4px;}
.turn strong{display:block;color:var(--text);font-size:2rem;letter-spacing:-.02em;text-transform:none;margin-top:4px;font-weight:800;}
.card{
  flex:1;min-height:300px;border-radius:28px;padding:28px 24px;
  background:var(--g, linear-gradient(160deg,#2c2249,#221a3b));
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
  box-shadow:0 30px 60px -30px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.12);
  position:relative;overflow:hidden;
  animation:pop .32s cubic-bezier(.2,.9,.3,1.3);
}
.card .tag{position:absolute;top:18px;left:0;right:0;font-size:.78rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;opacity:.8;}
.card .txt{font-size:clamp(1.45rem,6.4vw,2.1rem);font-weight:700;line-height:1.18;letter-spacing:-.01em;text-wrap:balance;}
.card .sub{margin-top:18px;font-size:.95rem;opacity:.85;}
.card .count{position:absolute;bottom:16px;left:0;right:0;font-size:.8rem;opacity:.6;}
@keyframes pop{from{transform:scale(.92) translateY(12px);opacity:0}to{transform:none;opacity:1}}
.hint{text-align:center;color:var(--muted);font-size:.92rem;margin:0;}
.row{display:flex;gap:10px;}
.row > *{flex:1;}

.choice{
  flex:1;border-radius:28px;font-size:1.9rem;font-weight:800;color:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;min-height:150px;letter-spacing:-.02em;
}
.choice small{font-size:.9rem;font-weight:500;opacity:.85;letter-spacing:0;}
.choice:active{transform:scale(.97);}

.wyr{flex:1;display:flex;flex-direction:column;gap:12px;position:relative;}
.wyr button{
  flex:1;border-radius:28px;padding:24px;font-size:clamp(1.25rem,5.6vw,1.7rem);font-weight:700;color:#fff;line-height:1.2;
  transition:transform .15s, opacity .2s, outline-color .2s;outline:4px solid transparent;outline-offset:-4px;
  animation:pop .32s cubic-bezier(.2,.9,.3,1.3);text-wrap:balance;
}
.wyr button.sel{outline-color:#fff;transform:scale(1.02);}
.wyr button.dim{opacity:.4;}
.wyr .or{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;
  background:var(--bg);display:grid;place-items:center;font-weight:800;border:4px solid var(--bg-2);z-index:2;pointer-events:none;}

.big-num{font-size:9rem;font-weight:800;line-height:1;animation:pop .3s;}

/* Imposteur */
.reveal{display:flex;flex-direction:column;gap:14px;flex:1;}
.secret{font-size:clamp(2rem,10vw,3.2rem);font-weight:800;letter-spacing:-.02em;}
.opts{display:flex;flex-direction:column;gap:8px;}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--panel);border:2px solid transparent;text-align:left;}
.opt.on{border-color:var(--accent);background:var(--panel-2);}
.opt .r{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);flex:none;}
.opt.on .r{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 45%,transparent 50%);}
.opt b{display:block;}
.opt span{color:var(--muted);font-size:.85rem;}
.seg{display:flex;background:var(--panel);border-radius:14px;padding:4px;gap:4px;}
.seg button{flex:1;padding:10px;border-radius:10px;font-weight:700;color:var(--muted);}
.seg button.on{background:var(--panel-2);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.3);}
.label{font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700;margin:6px 0 -4px;}

/* Timer */
.timer{height:10px;border-radius:999px;background:var(--panel);overflow:hidden;}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--accent-2),var(--accent));transform-origin:left;}
.clock{font-size:3.4rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}

/* Scores */
.scores{display:flex;flex-direction:column;gap:6px;}
.score{display:flex;justify-content:space-between;padding:12px 16px;border-radius:14px;background:var(--panel);font-weight:700;}
.score.lead{background:linear-gradient(135deg,rgba(255,181,71,.3),rgba(255,92,138,.25));}
.found{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
.found span{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.12);font-size:.9rem;}
.found span.x{opacity:.45;text-decoration:line-through;}

/* Bombe */
.bomb{font-size:9rem;line-height:1;display:inline-block;filter:drop-shadow(0 20px 30px rgba(0,0,0,.5));}
.bomb.tick{animation:tick var(--spd,1s) infinite;}
@keyframes tick{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.12) rotate(4deg)}}
.flash{animation:flash .6s 3;}
@keyframes flash{0%,100%{background:var(--bg)}50%{background:#ff2e2e}}
.shake{animation:shake .5s;}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-10px,4px)}40%{transform:translate(10px,-6px)}60%{transform:translate(-8px,6px)}80%{transform:translate(6px,-4px)}}

/* Roue */
.wheel-name{font-size:clamp(2.4rem,12vw,4rem);font-weight:800;letter-spacing:-.03em;transition:color .1s;}
.wheel-name.final{animation:pop .4s cubic-bezier(.2,.9,.3,1.6);color:var(--accent-2);}

/* Mes cartes */
textarea{
  width:100%;min-height:220px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;
  font-size:1rem;line-height:1.45;resize:vertical;outline:none;user-select:text;-webkit-user-select:text;
}
textarea:focus{border-color:var(--accent);}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tabs button{flex:none;padding:9px 14px;border-radius:999px;background:var(--panel);font-weight:700;font-size:.9rem;color:var(--muted);border:1px solid var(--line);}
.tabs button.on{background:var(--text);color:var(--bg);}

.rules h3{margin:18px 0 6px;font-size:1.1rem;}
.rules p{margin:0;color:var(--muted);line-height:1.5;font-size:.95rem;}

.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 24px);transform:translateX(-50%);background:var(--text);color:var(--bg);
  padding:12px 18px;border-radius:14px;font-weight:700;z-index:50;animation:toastin .25s ease-out;box-shadow:0 10px 30px rgba(0,0,0,.4);width:max-content;max-width:90vw;text-align:center;}
@keyframes toastin{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}

/* Fenêtre de mise à jour */
.upd{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:24px;background:rgba(8,5,16,.72);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .2s;}
.upd .box{width:100%;max-width:340px;background:var(--bg-2);border:1px solid var(--line);border-radius:26px;padding:26px 22px 18px;text-align:center;
  box-shadow:0 30px 60px rgba(0,0,0,.6);animation:pop .35s cubic-bezier(.2,.9,.3,1.3);}
.upd .ico{width:64px;height:64px;margin:0 auto 12px;border-radius:20px;display:grid;place-items:center;font-size:2rem;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 10px 30px -10px rgba(255,92,138,.8);}
.upd h3{margin:0 0 6px;font-size:1.35rem;font-weight:800;letter-spacing:-.01em;}
.upd p{margin:0 0 18px;color:var(--muted);line-height:1.45;font-size:.95rem;}
.upd .later{margin-top:6px;width:100%;padding:12px;color:var(--muted);font-weight:700;}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---------- Mode en ligne ---------- */
.online-cta{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border-radius:var(--radius);margin:4px 0 14px;
  background:linear-gradient(120deg,#2b2152,#3a1d4a);border:1px solid rgba(255,255,255,.14);box-shadow:0 14px 30px -18px rgba(0,0,0,.8);}
.online-cta .e{font-size:2rem;}
.online-cta b{display:block;font-size:1.1rem;font-weight:800;}
.online-cta small{color:var(--muted);font-size:.85rem;}
.online-cta .go{margin-left:auto;font-size:1.8rem;color:var(--muted);}
.online-cta:active{transform:scale(.98);}
.errbox{margin:0;padding:12px 14px;border-radius:14px;background:rgba(255,77,77,.14);border:1px solid rgba(255,77,77,.4);color:#ffc9c9;font-size:.92rem;line-height:1.4;}
.or-sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;font-weight:700;}
.or-sep::before,.or-sep::after{content:"";flex:1;height:1px;background:var(--line);}
.codein{text-transform:uppercase;letter-spacing:.3em;font-weight:800;text-align:center;font-size:1.2rem!important;}
.spinner{width:46px;height:46px;border-radius:50%;border:4px solid var(--panel-2);border-top-color:var(--accent);animation:spin .8s linear infinite;margin:0 auto 10px;}
.spinner.small{width:18px;height:18px;border-width:3px;margin:0;display:inline-block;vertical-align:-3px;}
@keyframes spin{to{transform:rotate(360deg)}}
.room-code{font-weight:800;letter-spacing:.18em;background:var(--panel);border:1px solid var(--line);padding:8px 10px;border-radius:12px;font-size:.9rem;}
.codecard{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px;border-radius:var(--radius);background:var(--bg-2);border:1px solid var(--line);}
.codecard span{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;font-weight:700;}
.codecard b{font-size:3.4rem;letter-spacing:.2em;font-weight:800;line-height:1.1;padding-left:.2em;}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block;}
.chip.offline{opacity:.5;}
.chip.offline .dot{background:var(--muted);}
.waiting{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--muted);padding:16px;border-radius:16px;background:var(--bg-2);border:1px dashed var(--line);text-align:center;}
.btn.ghost{background:none;border:0;color:var(--muted);font-size:.85rem;font-weight:600;padding:8px;}
.secret.blur{filter:blur(14px);}
.hideable{cursor:pointer;}

.seats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px;}
.seats::-webkit-scrollbar{display:none;}
.seat{flex:1 0 auto;min-width:80px;padding:8px 10px;border-radius:14px;background:var(--panel);border:2px solid transparent;text-align:center;}
.seat b{display:block;font-size:.88rem;white-space:nowrap;}
.seat span{font-size:.78rem;color:var(--muted);}
.seat em{display:block;font-style:normal;font-size:.68rem;color:var(--accent-2);font-weight:700;}
.seat.now{border-color:var(--accent);background:var(--panel-2);}
.seat.done{opacity:.55;}
.table{min-height:150px;border-radius:28px;background:radial-gradient(ellipse at center,#1d6b4a,#0f3d2b);border:6px solid #3a2a1a;box-shadow:inset 0 0 30px rgba(0,0,0,.5);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;}
.table small{color:rgba(255,255,255,.75);font-weight:600;}
.pile{display:flex;gap:6px;animation:pop .3s;}
.log{text-align:center;margin:0;font-weight:700;font-size:.95rem;}
.exch{margin:0;text-align:center;font-size:.85rem;color:var(--accent-2);}
.turnbar{text-align:center;padding:10px;border-radius:14px;background:var(--panel);color:var(--muted);font-weight:700;}
.turnbar.mine{background:linear-gradient(135deg,var(--accent),#ff7a6b);color:#fff;animation:pop .3s;}
.hand{display:flex;flex-wrap:wrap;justify-content:center;padding:14px 0 0 22px;}
.cardbtn{margin:0 0 10px -22px;padding:0;}
.pc{width:50px;height:72px;border-radius:9px;background:#fffdf8;color:#16131c;display:flex;flex-direction:column;align-items:flex-start;padding:5px 6px;
  box-shadow:-3px 2px 6px rgba(0,0,0,.35);border:1px solid rgba(0,0,0,.12);line-height:1;transition:transform .12s;font-family:inherit;}
.pc b{font-size:1.1rem;font-weight:800;}
.pc i{font-style:normal;font-size:1.25rem;}
.pc.red{color:#d42b3a;}
.pc.sel{transform:translateY(-14px);box-shadow:0 0 0 3px var(--accent),0 10px 20px rgba(0,0,0,.4);}
.pc.big{width:62px;height:88px;padding:7px 8px;}
.pc.big b{font-size:1.4rem;} .pc.big i{font-size:1.6rem;}
.ranking{display:flex;flex-direction:column;gap:8px;width:100%;}
.ranking div{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:rgba(0,0,0,.2);text-align:left;}
.ranking span{opacity:.7;font-weight:700;width:22px;}
.ranking b{flex:1;font-size:1.1rem;}
.ranking em{font-style:normal;font-weight:700;font-size:.9rem;}

/* Doigt élu */
.fzone{position:relative;flex:1;min-height:calc(100vh - 190px);border-radius:28px;background:var(--bg-2);border:2px dashed var(--line);
  overflow:hidden;touch-action:none;-webkit-touch-callout:none;display:flex;align-items:flex-start;justify-content:center;}
.fzone.arming{border-color:var(--accent);}
.flabel{margin:22px 20px 0;text-align:center;color:var(--muted);font-weight:700;font-size:1.05rem;pointer-events:none;z-index:2;line-height:1.4;}
.fzone.done .flabel{color:var(--text);font-size:1.2rem;}
.finger{position:absolute;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;pointer-events:none;
  border:7px solid var(--c);background:color-mix(in srgb,var(--c) 25%,transparent);box-shadow:0 0 30px var(--c);transition:transform .3s,opacity .3s;}
.fzone.arming .finger{animation:fpulse .5s ease-in-out infinite alternate;}
@keyframes fpulse{to{transform:scale(1.25)}}
.finger.win{transform:scale(1.9);border-width:10px;z-index:3;}
.finger.lose{opacity:.12;transform:scale(.7);}
.finger.team{transform:scale(1.3);}

/* Duel de réflexes */
.duel{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);z-index:5;}
.dhalf{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;
  touch-action:none;transition:background .08s;border:4px solid var(--c);}
.dhalf.top{transform:rotate(180deg);}
.dhalf.ready,.dhalf.wait{background:#1b1430;}
.dhalf.trap{background:#e0b400;}
.dhalf.go{background:#18c76f;}
.dhalf.result,.dhalf.end{background:var(--bg-2);}
.dmsg{font-size:clamp(1.6rem,8vw,2.4rem);font-weight:800;letter-spacing:-.02em;}
.dmsg small{display:block;font-size:.95rem;font-weight:500;color:var(--muted);margin-top:8px;letter-spacing:0;}
.dscore{font-size:1rem;font-weight:800;color:var(--c);letter-spacing:.1em;}
.dhalf.go .dmsg,.dhalf.trap .dmsg{color:#10240f;font-size:clamp(2.6rem,14vw,4rem);}
.dmid{display:flex;align-items:center;justify-content:center;gap:12px;padding:8px;background:var(--bg);min-height:62px;}

/* Main sûre */
.level{position:relative;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,#24324a,#141a2b);border:3px solid var(--line);
  display:grid;place-items:center;box-shadow:inset 0 0 40px rgba(0,0,0,.6);}
.level i{position:absolute;width:250px;height:250px;border-radius:50%;border:4px solid var(--ok);box-shadow:0 0 20px rgba(61,220,151,.4);transition:transform .1s linear;}
.level b{position:absolute;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#ffb547 60%,#e0702a);box-shadow:0 4px 12px rgba(0,0,0,.5);}
/* Secoue-le */
.shake-num{font-size:7rem;font-variant-numeric:tabular-nums;animation:none;}

/* Yams */
.dice{display:flex;justify-content:center;gap:10px;}
.die{width:58px;height:58px;border-radius:14px;background:#fffdf8;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  padding:8px;gap:2px;box-shadow:0 6px 0 #c9c2b6,0 10px 20px rgba(0,0,0,.4);transition:transform .15s;}
.die i{width:10px;height:10px;border-radius:50%;margin:auto;}
.die i.on{background:#1c1626;}
.die.held{transform:translateY(-6px);box-shadow:0 0 0 4px var(--accent),0 6px 0 #c9c2b6;background:#ffe9ef;}
.die.roll{animation:dieroll .12s infinite alternate;}
.die:disabled{opacity:1;}
@keyframes dieroll{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}
.ysheet{display:flex;flex-direction:column;gap:4px;background:var(--bg-2);border:1px solid var(--line);border-radius:18px;padding:8px;}
.yrow{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:12px;font-weight:600;text-align:left;}
.yrow b{font-variant-numeric:tabular-nums;min-width:32px;text-align:right;color:var(--muted);}
.yrow[data-a]{background:var(--panel);}
.yrow.good b{color:var(--ok);}
.yrow.filled{opacity:.55;}
.yrow.filled b{color:var(--text);}
.ybonus{display:flex;justify-content:space-between;padding:8px 12px;margin:2px 0 6px;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);font-size:.85rem;color:var(--muted);}
.ybonus b{color:var(--accent-2);}

/* Le Menteur */
.die.small{width:40px;height:40px;padding:5px;border-radius:10px;box-shadow:0 4px 0 #c9c2b6;display:inline-grid;vertical-align:middle;}
.die.small i{width:7px;height:7px;}
.die.hit{box-shadow:0 0 0 3px var(--ok),0 4px 0 #c9c2b6;}
.die.dim{opacity:.35;}
.bidbox{text-align:center;padding:14px;border-radius:18px;background:var(--bg-2);border:1px solid var(--line);}
.bidbox small{color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:.72rem;}
.bidbox div{font-size:1.5rem;font-weight:800;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:10px;}
.bidpick{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;}
.stepper{display:flex;align-items:center;gap:8px;}
.stepper .btn{width:46px;height:46px;padding:0;font-size:1.4rem;}
.stepper b{font-size:1.8rem;min-width:36px;text-align:center;}
.faces{display:flex;gap:4px;}
.faces button{padding:3px;border-radius:12px;border:2px solid transparent;}
.faces button.on{border-color:var(--accent);background:var(--panel-2);}
.faces .die.small{width:34px;height:34px;padding:4px;}
.faces .die.small i{width:6px;height:6px;}
.allDice{display:flex;flex-direction:column;gap:8px;}
.allDice>div{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:var(--bg-2);}
.allDice .pname{min-width:64px;font-weight:700;font-size:.9rem;}
.allDice>div>div{display:flex;gap:5px;flex-wrap:wrap;}

/* Quiz buzzer */
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.qopt{display:flex;align-items:center;gap:8px;text-align:left;padding:12px;border-radius:14px;background:var(--panel);border:2px solid transparent;font-weight:700;font-size:.95rem;min-height:56px;}
.qopt span{width:24px;height:24px;border-radius:7px;background:var(--panel-2);display:grid;place-items:center;font-size:.75rem;flex:none;}
.qopt[data-a]{border-color:var(--accent);background:var(--panel-2);}
.qopt:disabled{opacity:1;}
.qopt.right{background:var(--ok);color:#06281a;}
.qopt.dim{opacity:.4;}
.qopt.wrongpick{border-color:var(--danger);text-decoration:line-through;}
.buzz{width:180px;height:180px;border-radius:50%;margin:6px auto;display:grid;place-items:center;font-size:2.4rem;font-weight:800;color:#fff;letter-spacing:.05em;
  background:radial-gradient(circle at 35% 30%,#ff8080,#e01e1e 60%,#9e0c0c);box-shadow:0 12px 0 #7a0909,0 20px 40px rgba(224,30,30,.5);transition:transform .06s,box-shadow .06s;}
.buzz:active{transform:translateY(10px);box-shadow:0 2px 0 #7a0909,0 6px 16px rgba(224,30,30,.5);}

/* Petit Bac */
.bacletter{display:flex;flex-direction:column;align-items:center;padding:12px;border-radius:20px;background:linear-gradient(160deg,#56ab2f,#1e6b52);}
.bacletter small{font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;opacity:.85;}
.bacletter b{font-size:3.6rem;line-height:1;font-weight:800;}
.bacform{display:flex;flex-direction:column;gap:8px;}
.bacform label{display:flex;flex-direction:column;gap:4px;}
.bacform span{font-size:.8rem;color:var(--muted);font-weight:700;}
.bacform input{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:1.05rem;outline:none;user-select:text;-webkit-user-select:text;}
.bacform input:focus{border-color:var(--accent);}
.baccat{background:var(--bg-2);border:1px solid var(--line);border-radius:16px;padding:10px;}
.baccat h4{margin:0 0 6px;font-size:.85rem;color:var(--muted);}
.bacans{display:flex;justify-content:space-between;width:100%;padding:8px 10px;border-radius:10px;margin-top:4px;text-align:left;gap:10px;}
.bacans span{font-size:.85rem;color:var(--muted);}
.bacans.ok{background:rgba(61,220,151,.14);}
.bacans.ok b{color:var(--ok);}
.bacans.ko b{color:var(--muted);text-decoration:line-through;}
.bacans:disabled{opacity:1;}

/* Le Dessin */
.dhead{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--muted);}
.dhead b{font-size:1.4rem;color:var(--text);font-variant-numeric:tabular-nums;min-width:40px;text-align:right;}
.dhead b.hot{color:var(--danger);}
.dword{text-align:center;font-size:1.3rem;font-weight:800;letter-spacing:.02em;min-height:1.6em;}
.dword .mask{letter-spacing:.12em;color:var(--accent-2);white-space:pre;}
.dcanvas{width:100%;aspect-ratio:1/1;max-height:56vh;border-radius:18px;background:#fff;touch-action:none;display:block;box-shadow:0 10px 30px rgba(0,0,0,.4);}
.dcanvas.mine{outline:3px solid var(--accent);}
.dtools{display:flex;align-items:center;justify-content:center;gap:5px;}
.dcol{width:30px;height:30px;flex:none;border-radius:50%;background:var(--c);border:3px solid var(--bg-2);box-shadow:0 0 0 1px var(--line);}
.dcol.on{box-shadow:0 0 0 3px var(--accent);}
.dsz{width:36px;height:36px;flex:none;border-radius:12px;background:var(--panel);font-size:.9rem;}
.dsz.big{font-size:1.4rem;}
.dsz.on{background:var(--text);color:var(--bg);}
.gfeed{display:flex;flex-direction:column;gap:4px;max-height:150px;overflow:auto;}
.gf{padding:7px 12px;border-radius:12px;background:var(--panel);font-size:.92rem;}
.gf b{color:var(--muted);margin-right:4px;}
.gf.ok{background:rgba(61,220,151,.16);color:var(--ok);font-weight:700;}
.gf.muted{color:var(--muted);background:none;text-align:center;}

/* Téléphone dessiné */
.tcanvas{width:100%;aspect-ratio:1/1;max-height:52vh;border-radius:18px;background:#fff;touch-action:none;display:block;box-shadow:0 10px 30px rgba(0,0,0,.4);}
.tcanvas.mine{outline:3px solid var(--accent);}
.tcanvas.small{max-height:none;width:78%;margin:0 auto;}
.dhead b.hot{color:var(--danger);}
.album{display:flex;flex-direction:column;gap:14px;}
.aitem{display:flex;flex-direction:column;gap:6px;animation:pop .35s;}
.aitem small{color:var(--muted);font-weight:700;}
.abubble{align-self:flex-start;max-width:90%;padding:12px 16px;border-radius:18px 18px 18px 4px;background:var(--panel-2);font-size:1.15rem;font-weight:700;}

/* Loups-garous */
.rolechip{align-self:center;padding:8px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:.9rem;cursor:pointer;}
.rolechip.wolf{border-color:rgba(255,77,77,.4);}
.lplayers{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.lp{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px;border-radius:14px;background:var(--panel);border:2px solid transparent;text-align:left;}
.lp[data-a]{border-color:var(--line);background:var(--panel-2);}
.lp.chosen{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);}
.lp.dead{opacity:.45;}
.lp:disabled{opacity:.7;}
.lp.dead:disabled{opacity:.4;}
.lp span{font-size:.78rem;color:var(--accent-2);font-weight:700;}
.lp em{font-style:normal;font-size:.75rem;color:#ff8a8a;}
.nightsky{height:6px;border-radius:999px;background:linear-gradient(90deg,#1b2a4a,#4b3b8a,#1b2a4a);}

.ogames{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.ogames .game{min-height:0;padding-top:50px;justify-content:flex-start;}
.ogames .game .e{font-size:1.8rem;top:10px;left:14px;right:auto;}
.ogames .game b{font-size:1.02rem;}
.ogames .game span:not(.e){font-size:.74rem;}

/* Jeux d'écriture en ligne */
.wform{display:flex;flex-direction:column;gap:10px;}
.wform textarea{min-height:96px;font-size:1.1rem;}
.vopts{display:flex;flex-direction:column;gap:8px;}
.vopt{text-align:left;padding:14px 16px;border-radius:16px;background:var(--panel-2);border:2px solid var(--line);font-weight:600;line-height:1.35;}
.vopt small{display:block;margin-top:6px;color:var(--muted);font-weight:600;font-size:.8rem;}
.vopt.chosen{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);}
.vopt.mine{opacity:.5;}
.vopt.res{background:var(--panel);}
.vopt.real{border-color:var(--ok);background:rgba(61,220,151,.12);}
.bigquote{font-size:clamp(1.3rem,6vw,1.8rem);font-weight:800;text-align:center;padding:26px 18px;border-radius:24px;background:var(--bg-2);border:1px solid var(--line);line-height:1.3;}

/* Votes en ligne */
.bars{display:flex;flex-direction:column;gap:8px;}
.bar{display:grid;grid-template-columns:90px 1fr 30px;align-items:center;gap:10px;font-weight:700;}
.bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar i{height:22px;border-radius:999px;background:var(--panel);position:relative;overflow:hidden;}
.bar i::after{content:"";position:absolute;inset:0;width:var(--w);background:linear-gradient(90deg,var(--accent-2),var(--accent));border-radius:999px;animation:grow .6s ease-out;}
.bar.top b{color:var(--accent-2);}
@keyframes grow{from{width:0}}
.opt.answer div span{display:block;font-size:.8rem;color:var(--accent-2);font-weight:700;margin-top:2px;}
.sgroups{display:flex;flex-direction:column;gap:8px;}
.sgroup{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--panel);}
.sgroup b{font-size:1.1rem;}
.sgroup span{flex:1;color:var(--muted);font-size:.85rem;text-align:right;}
.sgroup em{font-style:normal;font-weight:800;color:var(--ok);}
.sgroup.hit{background:rgba(61,220,151,.14);border:1px solid rgba(61,220,151,.4);}

/* Poker & Blackjack */
.pc.back{background:repeating-linear-gradient(45deg,#7a1630 0 6px,#a02040 6px 12px);border:3px solid #fff;}
.pc.slot{background:rgba(255,255,255,.08);border:2px dashed rgba(255,255,255,.25);box-shadow:none;}
.pc.tiny{width:26px;height:36px;padding:2px 3px;border-radius:5px;}
.pc.tiny b{font-size:.72rem;} .pc.tiny i{font-size:.75rem;}
.pktable .pile{gap:5px;}
.pktable .pc{width:50px;height:72px;}
.pkseats{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px;}
.pkseat{padding:8px 10px;border-radius:14px;background:var(--panel);border:2px solid transparent;display:flex;flex-direction:column;gap:2px;}
.pkseat b{font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pkseat > span{font-size:.8rem;color:var(--muted);font-weight:700;}
.pkseat em{font-style:normal;font-size:.75rem;color:var(--accent-2);font-weight:700;}
.pkseat.now{border-color:var(--accent);}
.pkseat.gone{opacity:.45;}
.pkseat.win{border-color:var(--ok);background:rgba(61,220,151,.12);}
.pkseat .mini{display:flex;gap:3px;margin-top:3px;}
.dbtn{font-style:normal;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#fff;color:#111;font-size:.65rem;font-weight:800;vertical-align:1px;}
.pkhand{display:flex;justify-content:center;gap:10px;}
.pkraise{display:flex;align-items:center;gap:12px;}
.pkraise input{flex:1;accent-color:var(--accent);}
.pkraise b{min-width:60px;text-align:right;font-variant-numeric:tabular-nums;}
.bjval{text-align:center;font-size:1.6rem;font-weight:800;}

/* 8 américain & Belote */
.cardbtn.no .pc{filter:brightness(.55);}
.cardbtn.ok .pc{box-shadow:0 0 0 2px var(--ok),-3px 2px 6px rgba(0,0,0,.35);}
.pc.trump{background:#fff6dc;}
.btable{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:auto auto auto;place-items:center;gap:4px;width:100%;}
.btable .bn{grid-column:2;grid-row:1;} .btable .bw{grid-column:1;grid-row:2;} .btable .be{grid-column:3;grid-row:2;} .btable .bs{grid-column:2;grid-row:3;}
.bscore{display:flex;align-items:center;justify-content:center;gap:10px;}
.bscore div{flex:1;text-align:center;padding:8px;border-radius:14px;background:var(--panel);}
.bscore div.us{background:linear-gradient(135deg,rgba(255,181,71,.25),rgba(255,92,138,.2));}
.bscore small{display:block;color:var(--muted);font-size:.72rem;font-weight:700;}
.bscore b{font-size:1.4rem;}
.bscore span{color:var(--muted);font-size:.8rem;}
.seg.suits button{font-size:1.8rem;color:var(--text);padding:6px;}
.seg.suits button.red{color:#ff4d5e;}
.bnames{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:.82rem;color:var(--muted);font-weight:600;}

/* Plateaux */
.duelbar{display:flex;align-items:center;gap:8px;}
.duelbar div{flex:1;padding:8px 10px;border-radius:14px;background:var(--panel);border:2px solid transparent;text-align:center;}
.duelbar div.now{border-color:var(--accent);}
.duelbar b{display:block;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.duelbar small{color:var(--muted);font-size:.75rem;font-weight:700;}
.duelbar span{font-weight:800;color:var(--muted);font-size:.8rem;}
.ngrid{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;background:#0b2545;padding:4px;border-radius:12px;}
.ncell{aspect-ratio:1;border-radius:4px;background:#13497a;padding:0;position:relative;}
.ncell[data-a]:active{background:#2a6fb0;}
.ncell.ship{background:#8fa3b8;}
.ncell.miss::after{content:"";position:absolute;inset:38%;border-radius:50%;background:#cfe3ff;}
.ncell.hit{background:#ff7a3d;} .ncell.ship.hit{background:#e8384f;}
.ncell.sunk{background:#7a1630;}
.small-grid{width:62%;margin:0 auto;}
.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:#1d4ed8;padding:8px;border-radius:16px;}
.c4col{display:flex;flex-direction:column;gap:4px;padding:0;border-radius:10px;}
.c4col[data-a]:active{background:rgba(255,255,255,.12);}
.c4col i{aspect-ratio:1;border-radius:50%;background:#0f1d4a;box-shadow:inset 0 3px 6px rgba(0,0,0,.5);}
.c4col i.red{background:radial-gradient(circle at 35% 35%,#ff6b6b,#d00000);}
.c4col i.yel{background:radial-gradient(circle at 35% 35%,#ffe066,#f4b400);}
.c4col i.win{box-shadow:0 0 0 3px #fff;}
.c4col i.last{outline:2px dashed rgba(255,255,255,.6);outline-offset:-6px;}
.gomoku{display:grid;grid-template-columns:repeat(var(--n),1fr);background:#e9d7b3;padding:3px;border-radius:10px;gap:1px;}
.gcell{aspect-ratio:1;padding:0;background:#f6ead0;color:#16131c;font-size:.75rem;font-weight:800;line-height:1;display:grid;place-items:center;}
.gcell.x{color:#d42b3a;} .gcell.o{color:#1d4ed8;}
.gcell.win{background:#ffd76a;} .gcell.last{background:#fff4c2;}
.dboard,.cboard{display:grid;border-radius:10px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.45);}
.dboard{grid-template-columns:repeat(10,1fr);}
.cboard{grid-template-columns:repeat(8,1fr);}
.dsq,.csq{aspect-ratio:1;padding:0;background:#f0d9b5;position:relative;display:grid;place-items:center;border-radius:0;}
.dsq.dark{background:#8b5a2b;} .csq.dark{background:#b58863;}
.dsq.sel,.csq.sel{background:#f6d743!important;}
.dsq.last,.csq.last{box-shadow:inset 0 0 0 3px rgba(255,235,59,.7);}
.dsq.cap{box-shadow:inset 0 0 0 3px rgba(255,77,77,.7);}
.dsq.tgt::after,.csq.tgt::after{content:"";width:30%;height:30%;border-radius:50%;background:rgba(20,180,90,.85);position:absolute;}
.csq.tgt.cap::after{width:86%;height:86%;background:none;border:4px solid rgba(20,180,90,.85);}
.csq.chk{background:radial-gradient(circle,#ff5c5c,#b31b1b)!important;}
.pion{width:78%;height:78%;border-radius:50%;display:block;box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 -3px 0 rgba(0,0,0,.15);}
.pion.w{background:radial-gradient(circle at 40% 35%,#fff,#ddd);} .pion.b{background:radial-gradient(circle at 40% 35%,#555,#111);}
.pion.k::after{content:"♛";display:grid;place-items:center;height:100%;font-size:.9rem;color:#d4a017;}
.dsq.mov .pion{outline:2px solid rgba(20,180,90,.9);outline-offset:1px;}
.csq span{font-size:clamp(1.4rem,8vw,2.2rem);line-height:1;}
.csq .pw{color:#fff;text-shadow:0 0 2px #000,0 1px 2px #000;} .csq .pb{color:#111;}
.cf,.cr{position:absolute;font-style:normal;font-size:.55rem;font-weight:800;opacity:.7;color:#3a2a1a;}
.cf{right:2px;bottom:1px;} .cr{left:2px;top:1px;}

/* Courses en direct */
.tpad{width:100%;aspect-ratio:1.4;border-radius:28px;background:var(--panel);border:3px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;transition:background .2s;}
.tpad b{font-size:4.5rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;}
.tpad small{color:var(--muted);font-weight:700;}
.tpad.on{background:linear-gradient(150deg,#f857a6,#ff5858);border-color:transparent;}
.tpad.on small{color:#fff;}
.tpad.pulse{animation:tpp .12s;}
@keyframes tpp{50%{transform:scale(.97)}}
.rzone{width:100%;min-height:62vh;border-radius:28px;background:#2b2147;display:grid;place-items:center;touch-action:none;}
.rzone b{font-size:2.2rem;font-weight:800;}
.rzone.go{background:#18c76f;color:#06281a;}
.rzone.done{background:var(--panel-2);}
.ranking div.lose{background:rgba(255,77,77,.18);}
.mgrid{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px;}
.mcell{aspect-ratio:1;border-radius:8px;background:var(--panel);font-weight:800;font-size:1.05rem;padding:0;}
.mcell.found{background:rgba(61,220,151,.28);color:var(--ok);}
.mcell.sel{background:var(--accent);color:#fff;}
.mwords{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
.mwords span{padding:6px 10px;border-radius:999px;background:var(--panel);font-weight:700;font-size:.85rem;letter-spacing:.06em;}
.mwords span.ok{background:rgba(61,220,151,.18);color:var(--ok);}
.mwords small{color:var(--muted);letter-spacing:0;font-weight:600;}

/* Thème du mode épicé 🌶️ */
html.spicy{--bg:#160505;--bg-2:#240909;--panel:#330d0d;--panel-2:#451212;--line:rgba(255,140,120,.14);--text:#fff1ec;--muted:#d9a39a;--accent:#ff2e3b;--accent-2:#ff9f1c;}
html.spicy body{background-image:radial-gradient(60rem 40rem at 110% -10%,rgba(255,46,59,.35),transparent 60%),radial-gradient(50rem 40rem at -20% 110%,rgba(255,120,20,.28),transparent 60%);}
html.spicy .brand .logo{background:linear-gradient(135deg,#ff2e3b,#ff9f1c);box-shadow:0 10px 30px -8px rgba(255,46,59,.9);animation:flame 2.4s ease-in-out infinite;}
html.spicy .btn.primary{background:linear-gradient(135deg,#ff2e3b,#ff7a00);}
html.spicy .switch.on{background:#ff2e3b;}
html.spicy .online-cta{background:linear-gradient(120deg,#4a0f12,#5a2408);}
.spicynote{margin:6px 2px 0;padding:10px 14px;border-radius:14px;background:rgba(255,46,59,.14);border:1px solid rgba(255,46,59,.35);color:var(--text);font-size:.85rem;line-height:1.4;}
html.spicy.lvl2{--bg:#0b0207;--bg-2:#17040f;--panel:#240718;--panel-2:#330a22;--line:rgba(255,60,140,.18);--muted:#d79bbd;--accent:#ff1f6d;--accent-2:#b100ff;}
html.spicy.lvl2 body{background-image:radial-gradient(60rem 40rem at 110% -10%,rgba(255,31,109,.38),transparent 60%),radial-gradient(50rem 40rem at -20% 110%,rgba(177,0,255,.32),transparent 60%);}
html.spicy.lvl2 .brand .logo{background:linear-gradient(135deg,#ff1f6d,#b100ff);box-shadow:0 10px 34px -6px rgba(255,31,109,.95);}
html.spicy.lvl2 .btn.primary{background:linear-gradient(135deg,#ff1f6d,#b100ff);}
html.spicy.lvl2 .switch.on{background:#ff1f6d;}
html.spicy.lvl2 .hotbadge{background:linear-gradient(135deg,#ff1f6d,#b100ff);}
html.spicy.lvl2 .online-cta{background:linear-gradient(120deg,#3a0624,#2a0848);}
html.spicy.lvl2 .spicynote{background:rgba(255,31,109,.14);border-color:rgba(255,31,109,.38);}
.lvlseg{margin:2px 0 6px;}
.lvlseg button.on{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;}
.hotbadge{font-size:.9rem;vertical-align:middle;background:#ff2e3b;color:#fff;padding:3px 8px;border-radius:999px;letter-spacing:0;margin-left:4px;}
@keyframes flame{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(3deg) scale(1.06)}}

.explain{margin-top:16px;padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.22);font-size:.98rem;line-height:1.45;text-align:left;font-weight:500;}
.explain b{font-weight:800;}

.qr{width:180px;height:180px;background:#fff;border-radius:16px;padding:8px;margin:6px 0 2px;}
.qr svg{width:100%;height:100%;display:block;}
.qrhint{font-size:.75rem!important;text-transform:none!important;letter-spacing:0!important;}
.minis{display:flex;gap:6px;}
.mini{width:44px;height:36px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);font-size:1.1rem;opacity:.45;}
.mini.on{opacity:1;border-color:var(--accent);}

/* Jeux à boire */
.bigdeck{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px;border-radius:24px;background:var(--bg-2);border:2px dashed var(--line);}
.bigdeck span:not(.pc){font-weight:800;font-size:1.2rem;}
.bigdeck small{color:var(--muted);font-weight:700;}
.pc.huge{width:96px;height:136px;padding:10px 12px;border-radius:14px;}
.pc.huge b{font-size:2.2rem;} .pc.huge i{font-size:2.4rem;}
.roicard{flex:none;min-height:0;padding:22px 18px;gap:10px;}
.roiface{margin-bottom:6px;animation:pop .35s;}
.rules-live{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:16px;background:var(--bg-2);border:1px solid var(--line);font-size:.9rem;}
.pyrhand{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px 0;}
.pyr{display:flex;flex-direction:column;align-items:center;gap:6px;}
.pyr>div{display:flex;gap:6px;}
.pyr .pc{width:46px;height:66px;}
.pc.cur{box-shadow:0 0 0 3px var(--accent-2),0 6px 16px rgba(0,0,0,.4);transform:scale(1.08);}
.pc.done{opacity:.55;}
.pyrall{display:flex;flex-direction:column;gap:6px;}
.pyrall>div{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--bg-2);}
.pyrall span{min-width:64px;font-weight:700;font-size:.9rem;}
.pyrall>div>div{display:flex;gap:4px;}
.busgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.busrow{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;}
.busrow .pc{width:48px;height:68px;}

/* Soirée : compteur, stats, soirée auto */
.sipfab{position:fixed;right:16px;bottom:calc(var(--safe-b) + 16px);z-index:40;width:54px;height:54px;border-radius:50%;font-size:1.6rem;display:none;place-items:center;
  background:var(--panel);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.45);}
body.ingame .sipfab{display:grid;}
.sipfab:active{transform:scale(.92);}
.sipsheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;animation:fadein .18s ease-out both;}
.sipsheet .box{animation:sheetup .26s cubic-bezier(.2,.9,.3,1) both;will-change:transform;}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes sheetup{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sipsheet .box{width:100%;max-width:520px;max-height:80vh;overflow:auto;background:var(--panel);border-radius:var(--radius) var(--radius) 0 0;padding:18px 16px calc(var(--safe-b) + 18px);}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.sheethead .x{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.08);}
.siprow{display:grid;grid-template-columns:1fr 40px 40px 44px 44px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);}
.siprow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;}
.siprow b{text-align:center;font-size:1.15rem;}
.siprow button{height:38px;border-radius:12px;background:rgba(255,255,255,.08);font-weight:800;}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0;}
.pod{background:var(--panel);border-radius:16px;padding:12px 6px;text-align:center;display:flex;flex-direction:column;gap:3px;min-width:0;}
.pod span{font-size:1.8rem;}
.pod small{color:var(--muted);font-size:.72rem;}
.pod b{font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pod em{font-style:normal;color:var(--muted);font-size:.78rem;}
.pod.gold{background:linear-gradient(160deg,#ffd76a33,var(--panel));border:1px solid #ffd76a66;}
.stable{background:var(--panel);border-radius:16px;padding:6px 12px;margin:10px 0;}
.stable>div{display:grid;grid-template-columns:1fr 44px 44px 44px;padding:8px 0;border-bottom:1px solid var(--line);font-weight:700;}
.stable>div:last-child{border-bottom:0;}
.stable>div span:not(:first-child){text-align:center;}
.stable .sh{color:var(--muted);font-size:.8rem;}
.sareel{margin:16px 0;min-height:170px;border-radius:var(--radius);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:18px;text-align:center;transition:background .3s;}
.sareel span{font-size:3.4rem;}
.sareel b{font-size:1.4rem;font-weight:800;}
.sareel small{color:rgba(255,255,255,.85);}
.sareel.done{background:var(--g);animation:toastin .35s ease;}
.soiree-cta{background:linear-gradient(135deg,#ffb84d33,#ff5c8a33)!important;}
.chip .ava{background:none;font-size:1.05rem;width:26px;}
.homelinks{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.themes{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.themes::-webkit-scrollbar{display:none;}
.themes button{flex:none;padding:9px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:.9rem;white-space:nowrap;}
.themes button.on{background:var(--accent);border-color:transparent;color:#fff;}
.themenote{background:rgba(255,184,77,.12)!important;border-color:rgba(255,184,77,.35)!important;}
/* Écran TV (spectateur) */
.tvbtn{margin-top:10px;}
.tvbtn small{display:block;font-weight:500;color:var(--muted);font-size:.78rem;}
.tvhint{font-size:.85rem;text-align:left;margin:4px 0 0;}
html.tv #app{max-width:820px;}
@media (min-width:1100px){html.tv #app{zoom:1.35;}}
@media (min-width:1700px){html.tv #app{zoom:1.8;}}
html.tv .stage input,html.tv .stage textarea,html.tv .stage .btn.primary,html.tv .stage .hand,html.tv .sipfab{display:none!important;}
html.tv .mineonly,html.tv .stage .buzz{display:none!important;}
html.tv .cboard,html.tv .dboard,html.tv .ngrid,html.tv .gomoku,html.tv .c4,html.tv .mgrid{width:min(100%,40vh)!important;max-width:min(100%,40vh)!important;margin-left:auto;margin-right:auto;}
html.tv .tvlobby .codecard b{font-size:4.5rem;letter-spacing:.2em;}
html.tv .tvlobby .qr{width:260px;height:260px;}
/* Arcade */
.arena{position:relative;flex:1;min-height:0;height:calc(100dvh - var(--safe-t) - var(--safe-b) - 110px);border-radius:20px;overflow:hidden;background:#120d1f;touch-action:none;user-select:none;-webkit-user-select:none;}
.arena canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
.duelarena{height:calc(100dvh - var(--safe-t) - var(--safe-b) - 96px);}
.ahud{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.45);padding:6px 14px;border-radius:999px;font-size:1rem;white-space:nowrap;pointer-events:none;}
.ahud b{font-size:1.3rem;}
.ahud small{color:rgba(255,255,255,.75);margin-left:4px;}
.arules{display:flex;gap:14px;align-items:center;background:var(--panel);border-radius:18px;padding:14px 16px;text-align:left;}
.arules span{font-size:2.6rem;}
.arules p{margin:0;line-height:1.45;font-size:.95rem;}
.arecord{text-align:center;font-weight:800;font-size:1.2rem;color:#ffd76a;margin:0;animation:toastin .4s ease;}
.dpair{display:flex;align-items:center;gap:10px;}
.dpair div{flex:1;background:var(--panel);border-radius:16px;padding:12px;text-align:center;}
.dpair small{display:block;color:var(--muted);font-size:.75rem;}
.dpair b{font-size:1.1rem;}
.dpair i{font-style:normal;font-weight:800;color:var(--muted);}
body:has(.arena) .sipfab{display:none;}
/* ---------- Accueil v35 ---------- */
.hbar{display:flex;align-items:center;gap:12px;margin:4px 0 8px;}
.hbar .logo{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:1.6rem;background:linear-gradient(150deg,var(--accent),var(--accent-2,#ff9f1c));box-shadow:0 8px 20px rgba(0,0,0,.3);}
.hbar h1{margin:0;font-size:1.9rem;font-weight:800;letter-spacing:-.03em;flex:1;}
.modes{display:flex;flex-wrap:wrap;align-items:center;gap:6px;width:100%;margin:0 0 14px;padding:0;background:none;text-align:left;}
.modes span{font-size:.78rem;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);}
.modes em{font-style:normal;font-size:.78rem;color:var(--muted);text-decoration:underline;margin-left:2px;}
.pcard{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;}
.pcard-h{display:flex;flex-direction:column;margin-bottom:10px;}
.pcard-h b{font-size:1.05rem;}
.pcard-h small{color:var(--muted);font-size:.8rem;margin-top:2px;}
.pchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.pchip{display:inline-flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 3px;font-weight:700;font-size:.92rem;}
.pchip .ava{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.06);font-size:1.05rem;display:grid;place-items:center;}
.pchip span{padding:0 4px;}
.pchip .x{width:24px;height:24px;border-radius:50%;font-size:.7rem;color:var(--muted);display:grid;place-items:center;}
.pcard .add-row .btn{min-width:52px;font-size:1.4rem;padding:0 14px;}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.qtile{background:var(--g);border-radius:20px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:104px;color:#fff;box-shadow:0 10px 24px rgba(0,0,0,.28);position:relative;overflow:hidden;}
.qtile span{font-size:1.9rem;line-height:1;margin-bottom:auto;}
.qtile b{font-size:1.08rem;font-weight:800;margin-top:10px;}
.qtile small{font-size:.78rem;opacity:.9;}
.qtile:active,.gcard:active{transform:scale(.97);}
.cats{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px 4px;scrollbar-width:none;position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 75%,transparent);}
.cats::-webkit-scrollbar{display:none;}
.cats button{flex:none;padding:9px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:.9rem;white-space:nowrap;color:var(--muted);}
.cats button.on{background:var(--text);color:var(--bg);border-color:var(--text);}
.mnote{font-size:.82rem;color:var(--muted);margin:-4px 2px 10px;}
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.gcard{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:12px;border-radius:18px;background:var(--panel);border:1px solid var(--line);min-height:128px;overflow:hidden;}
.gcard::before{content:"";position:absolute;inset:0 0 auto 0;height:56px;background:var(--g);opacity:.9;}
.gcard .ge{position:relative;width:52px;height:52px;margin:2px 0 10px;border-radius:16px;display:grid;place-items:center;font-size:1.9rem;background:var(--panel);box-shadow:0 6px 14px rgba(0,0,0,.3);}
.gcard b{font-size:1rem;font-weight:800;line-height:1.15;}
.gcard small{font-size:.76rem;color:var(--muted);margin-top:3px;line-height:1.25;}
.gcard .gtag{position:absolute;top:8px;right:8px;font-style:normal;font-size:1rem;background:rgba(0,0,0,.3);border-radius:999px;padding:2px 6px;}
.gcard.off{opacity:.45;filter:grayscale(.8);}
.glater{margin:18px 2px 8px;font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;}
.packs{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.packs button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:10px 12px;border-radius:16px;background:var(--panel);border:2px solid transparent;}
.packs button span{font-size:1.5rem;}
.packs button b{font-size:.92rem;margin-top:2px;}
.packs button small{font-size:.72rem;color:var(--muted);line-height:1.2;margin-top:2px;}
.packs button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--panel));}
.rowlink{display:flex;align-items:center;gap:12px;width:100%;padding:12px 2px;text-align:left;}
.rowlink + .rowlink{border-top:1px solid var(--line);}
.rowlink span{font-size:1.3rem;}
.rowlink b{flex:1;font-weight:700;}
.rowlink i{font-style:normal;color:var(--muted);font-size:1.4rem;}
/* ---------- v36 : sélecteur, récents, bienvenue ---------- */
.qpick{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;margin-bottom:10px;border-radius:20px;text-align:left;background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 30%,var(--panel)),var(--panel));border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);}
.qpick > span:first-child{font-size:1.8rem;}
.qpick .qt{display:flex;flex-direction:column;}
.qpick b{display:block;font-size:1.1rem;font-weight:800;}
.qpick small{display:block;color:var(--muted);font-size:.8rem;}
.qpick i{margin-left:auto;font-style:normal;font-size:1.6rem;color:var(--muted);}
.qpick:active{transform:scale(.98);}
.rrow{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 6px;padding:0 16px 4px;scrollbar-width:none;}
.rrow::-webkit-scrollbar{display:none;}
.rcard{flex:none;width:96px;padding:10px 8px;border-radius:16px;background:var(--g);display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;color:#fff;}
.rcard span{font-size:1.7rem;}
.rcard b{font-size:.74rem;line-height:1.15;font-weight:800;}
.pstep{text-align:center;margin:8px 0 6px;}
.pstep i{display:block;font-style:normal;color:var(--muted);font-weight:700;font-size:.8rem;letter-spacing:.1em;}
.pstep b{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;}
.plist{display:flex;flex-direction:column;gap:10px;}
.plist button{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:14px;align-items:center;text-align:left;padding:14px 16px;border-radius:18px;background:var(--panel);border:1px solid var(--line);}
.plist button span{grid-row:1/3;font-size:2.1rem;}
.plist button b{font-size:1.08rem;}
.plist button small{color:var(--muted);font-size:.82rem;}
.plist button:active{transform:scale(.98);background:var(--panel-2);}
.plist.two button{padding:20px 16px;}
.presults{display:flex;flex-direction:column;gap:10px;}
.pres{display:flex;align-items:center;gap:14px;padding:14px;border-radius:20px;background:var(--g);color:#fff;text-align:left;box-shadow:0 10px 24px rgba(0,0,0,.25);animation:fadein .3s ease both;}
.pres:nth-child(2){animation-delay:.08s}.pres:nth-child(3){animation-delay:.16s}
.pres .ge{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:2rem;background:rgba(0,0,0,.18);flex:none;}
.pres .t{flex:1;display:flex;flex-direction:column;}
.pres b{font-size:1.15rem;font-weight:800;}
.pres small{font-size:.82rem;opacity:.9;}
.pres i{font-style:normal;font-weight:800;font-size:.75rem;background:rgba(255,255,255,.25);padding:4px 8px;border-radius:999px;}
.onboard{justify-content:center;text-align:center;padding-top:20px;}
.onboard h1{margin:0;font-size:2.2rem;font-weight:800;letter-spacing:-.03em;}
.obhero{font-size:4.5rem;line-height:1;animation:sheetup .5s cubic-bezier(.2,.9,.3,1) both;}
.obdots{display:flex;justify-content:center;gap:6px;}
.obdots i{width:8px;height:8px;border-radius:50%;background:var(--line);}
.obdots i.on{background:var(--accent);width:22px;border-radius:4px;}
.obtips{display:flex;flex-direction:column;gap:8px;text-align:left;}
.obtips p{margin:0;background:var(--panel);border-radius:16px;padding:12px 14px;font-size:.92rem;line-height:1.35;display:flex;gap:10px;align-items:flex-start;}
.obtips span{font-size:1.3rem;}
.obtips b{margin-right:4px;}
/* ---------- v37 : écrans de jeu ---------- */
.top .tbtns{display:flex;gap:6px;margin-left:auto;flex:none;}
.top h1{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.icon-btn.sm{width:40px;height:40px;font-size:1.05rem;font-weight:800;}
.stage > .btn.big:last-child,.stage > .row:last-child{margin-top:auto;}
.stage .card:not(.still){animation:cardin .42s cubic-bezier(.2,.9,.3,1.15) both;}
@keyframes cardin{from{opacity:0;transform:perspective(900px) rotateY(-70deg) scale(.92)}to{opacity:1;transform:none}}
.rulesbox .rtext{max-height:52vh;overflow:auto;line-height:1.5;font-size:.95rem;}
.rulesbox .rtext p{margin:0 0 10px;}
.favbtn{margin-top:10px;}
.favbtn.on{border-color:#ffd76a;color:#ffd76a;}
.rcard{position:relative;}
.rcard i{position:absolute;top:4px;right:6px;font-style:normal;font-size:.75rem;}
.wheelbox{position:relative;width:min(86vw,360px);aspect-ratio:1;margin:8px auto 0;}
.wheelbox svg{width:100%;height:100%;display:block;filter:drop-shadow(0 14px 30px rgba(0,0,0,.45));border-radius:50%;}
.wheelbox::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:6px solid rgba(255,255,255,.12);pointer-events:none;}
.wpin{position:absolute;top:-14px;left:50%;transform:translateX(-50%);z-index:2;font-size:2rem;color:#fff;text-shadow:0 3px 8px rgba(0,0,0,.6);}
.wres{text-align:center;min-height:64px;display:flex;flex-direction:column;justify-content:center;gap:4px;}
.wres b{font-size:2rem;font-weight:800;}
.wres span{color:var(--muted);}
.wres.show b{animation:pop .45s cubic-bezier(.2,.9,.3,1.6);}
.wres.show span{color:var(--text);font-weight:700;}
/* ---------- v38 : en ligne ---------- */
.obig{display:flex;flex-direction:column;gap:10px;}
.obig button{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:14px;align-items:center;text-align:left;padding:18px;border-radius:20px;background:var(--g);color:#fff;box-shadow:0 10px 24px rgba(0,0,0,.28);}
.obig button span{grid-row:1/3;font-size:2.2rem;}
.obig button b{font-size:1.2rem;font-weight:800;}
.obig button small{font-size:.82rem;opacity:.9;}
.obig button:active{transform:scale(.98);}
.linkbtn{background:none;color:var(--muted);font-weight:700;font-size:.9rem;padding:10px;text-decoration:underline;margin-top:auto;}
.codecells{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:320px;width:100%;margin:0 auto;}
.codecells input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;z-index:2;}
.codecells span{aspect-ratio:3/4;border-radius:16px;background:var(--panel);border:2px solid var(--line);display:grid;place-items:center;font-size:2.4rem;font-weight:800;}
.codecells:focus-within span.cur{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent);}
.pchip.offline{opacity:.5;}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important;}}
