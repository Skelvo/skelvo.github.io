<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex">
<title>Tchat — Skelvo Stream</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!--
  Overlay "tchat Twitch" à coller dans OBS (Source > Navigateur).

  Lecture du tchat en anonyme via le WebSocket IRC officiel de Twitch
  (pseudo justinfanXXXX) : aucun compte, aucune clé, rien côté serveur.
  Emotes Twitch via le CDN officiel ; emotes 7TV / BTTV / FFZ via leurs API
  publiques (facultatif, chargées après réception de l'identifiant de la
  chaîne dans ROOMSTATE).

  Tout le texte des messages passe par textContent / createTextNode : jamais
  d'innerHTML avec du contenu venant du tchat.
-->
<style>
  :root{
    --fs: 20px; --ac: #9b5cff; --bg: rgba(14,12,24,.7);
    --font: 'Space Grotesk', system-ui, sans-serif;
  }
  html, body{ margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body{ font-family: var(--font); font-size: var(--fs); color: #fff; -webkit-font-smoothing: antialiased; }

  #chat{
    position: fixed; inset: 0;
    display: flex; flex-direction: column; justify-content: flex-end;
    gap: .32em; padding: .5em;
    overflow: hidden;
  }
  body.right #chat{ align-items: flex-end; }
  body.left  #chat{ align-items: flex-start; }

  .msg{ max-width: 100%; line-height: 1.35; overflow-wrap: anywhere; position: relative; }
  .meta{ display: inline-flex; align-items: center; gap: .25em; vertical-align: bottom; margin-right: .35em; }
  .name{ font-weight: 700; }
  .text .emote{ height: 1.5em; width: auto; vertical-align: middle; margin: -.25em .05em; display: inline-block; }
  .msg.emote-only .text .emote{ height: 2.6em; margin: 0 .05em; }
  .msg.action .text{ font-style: italic; color: var(--name-color); }

  .badges{ display: inline-flex; gap: .18em; }
  .badge{ width: 1.05em; height: 1.05em; border-radius: .25em; display: inline-grid; place-items: center; }
  .badge svg{ width: .72em; height: .72em; fill: #fff; }
  .b-broadcaster{ background: #e91916; } .b-moderator{ background: #00ad03; }
  .b-vip{ background: #e005b9; } .b-subscriber{ background: var(--ac); }
  .b-partner{ background: #9147ff; } .b-artist{ background: #1e69ff; }

  /* ---------- Thèmes ---------- */
  .t-bubble .msg{ background: var(--bg); padding: .38em .7em .42em; border-radius: .8em; box-shadow: 0 .2em .8em rgba(0,0,0,.25); }
  .t-bubble .msg.event{ background: linear-gradient(135deg, var(--ac), color-mix(in srgb, var(--ac) 55%, #000)); }

  .t-clean .msg{ padding: .1em .2em; text-shadow: 0 0 2px #000, 0 0 3px #000, 1px 1px 2px #000, -1px -1px 2px #000; }
  .t-clean .msg.event .text{ color: var(--ac); font-weight: 700; }

  .t-neon .msg{ background: var(--bg); padding: .36em .7em .4em .75em; border-radius: .35em; border-left: .18em solid var(--ac); box-shadow: -.15em 0 .7em -.1em var(--ac); }
  .t-neon .name{ text-shadow: 0 0 .5em currentColor; }
  .t-neon .msg.event{ border: .1em solid var(--ac); box-shadow: 0 0 1em var(--ac), inset 0 0 .6em color-mix(in srgb, var(--ac) 40%, transparent); }

  .t-card .msg{ background: var(--bg); padding: .45em .75em .55em; border-radius: .6em; border-top: .16em solid var(--name-color, var(--ac)); min-width: 6em; }
  .t-card .meta{ display: flex; margin: 0 0 .15em; font-size: .82em; }
  .t-card .msg.event{ border-top-color: var(--ac); background: color-mix(in srgb, var(--ac) 35%, var(--bg)); }

  .msg.event .sys{ display: block; font-weight: 700; }
  .msg.event .text{ display: block; margin-top: .15em; opacity: .95; }

  /* ---------- Animations d'entrée / sortie ---------- */
  .a-slide .msg{ animation: inSlide .35s cubic-bezier(.2,.9,.3,1.2) both; }
  body.right.a-slide .msg{ animation-name: inSlideR; }
  .a-fade  .msg{ animation: inFade .4s ease both; }
  .a-pop   .msg{ animation: inPop .35s cubic-bezier(.2,.9,.3,1.4) both; }
  @keyframes inSlide{ from{ opacity: 0; transform: translateX(-1.5em); } }
  @keyframes inSlideR{ from{ opacity: 0; transform: translateX(1.5em); } }
  @keyframes inFade{ from{ opacity: 0; transform: translateY(.6em); } }
  @keyframes inPop{ from{ opacity: 0; transform: scale(.6); } }
  .msg.out{ animation: out .5s ease forwards !important; }
  @keyframes out{ to{ opacity: 0; transform: translateY(-.3em); } }
</style>
</head>
<body>
<div id="chat" aria-live="polite"></div>

<script>
(function(){
  'use strict';

  var DEFAULTS = {
    ch: '', theme: 'bubble', fs: '20', max: '12', fade: '0',
    align: 'left', anim: 'slide', font: 'grotesk',
    ac: '9b5cff', bgo: '70', names: 'twitch',
    badges: '1', emotes3: '1', hidecmd: '1', events: '1',
    bots: 'nightbot,streamelements,streamlabs,moobot,fossabot,wizebot,sery_bot',
    demo: '0'
  };
  var FONTS = {
    grotesk: { css: "'Space Grotesk'", g: 'Space+Grotesk:wght@500;700' },
    rounded: { css: "'Nunito'",        g: 'Nunito:wght@600;800' },
    rubik:   { css: "'Rubik'",         g: 'Rubik:wght@500;700' },
    pixel:   { css: "'VT323'",         g: 'VT323' },
    system:  { css: 'system-ui' }
  };

  var chatEl = document.getElementById('chat');
  var P = {};                // réglages actuels
  var hidden = {};           // pseudos ignorés (bots)
  var thirdParty = {};       // nom d'emote -> URL (7TV, BTTV, FFZ)

  // ---------- Petits utilitaires ----------
  function num(v, min, max, def){ v = parseFloat(v); if (isNaN(v)) v = def; return Math.min(max, Math.max(min, v)); }
  function hex(v, def){ return /^[0-9a-f]{6}$/i.test(v || '') ? '#' + v : '#' + def; }
  function el(tag, cls){ var e = document.createElement(tag); if (cls) e.className = cls; return e; }

  function tellParent(state, extra){
    if (window.parent === window) return;
    try { window.parent.postMessage(Object.assign({ type: 'sk-status', state: state }, extra || {}), location.origin); } catch(e){}
  }

  // Couleur de pseudo : celle de Twitch, éclaircie si elle est illisible sur fond sombre
  var FALLBACK = ['#ff6b6b', '#ffa94d', '#ffd43b', '#69db7c', '#38d9a9', '#4dabf7', '#9775fa', '#f783ac', '#63e6be', '#ff922b'];
  function nameColor(raw, login){
    if (P.names === 'accent') return hex(P.ac, DEFAULTS.ac);
    if (P.names === 'white') return '#ffffff';
    var c = raw;
    if (!/^#[0-9a-f]{6}$/i.test(c || '')){
      var h = 0; for (var i = 0; i < login.length; i++) h = (h * 31 + login.charCodeAt(i)) >>> 0;
      return FALLBACK[h % FALLBACK.length];
    }
    var n = parseInt(c.slice(1), 16), r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
    var lum = (r * 299 + g * 587 + b * 114) / 1000;
    if (lum < 110){ var k = (110 - lum) / 160 + .25; r += (255 - r) * k; g += (255 - g) * k; b += (255 - b) * k; }
    return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
  }

  // ---------- Badges (dessinés ici : l'API officielle demande un compte) ----------
  var ICONS = {
    broadcaster: '<svg viewBox="0 0 16 16"><path d="M2 4h8a1 1 0 0 1 1 1v1.5L14 4v8l-3-2.5V11a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/></svg>',
    moderator:   '<svg viewBox="0 0 16 16"><path d="M13 1l2 2-7.5 7.5 1.5 1.5-1.5 1.5-1.5-1.5L3 15H1v-2l3-3-1.5-1.5L4 7l1.5 1.5z"/></svg>',
    vip:         '<svg viewBox="0 0 16 16"><path d="M4 2h8l3 4-7 8-7-8z"/></svg>',
    subscriber:  '<svg viewBox="0 0 16 16"><path d="M8 1l2.1 4.5 4.9.6-3.6 3.3.9 4.8L8 11.8 3.7 14.2l.9-4.8L1 6.1l4.9-.6z"/></svg>',
    partner:     '<svg viewBox="0 0 16 16"><path d="M6.5 12L2 7.5l1.5-1.5 3 3 6-6L14 4.5z"/></svg>',
    artist:      '<svg viewBox="0 0 16 16"><path d="M3 13c3 0 4-1.5 4-3.5L11 5l-1-1-4.5 4C3.5 8 2 9 2 12zM12 1l3 3-2 2-3-3z"/></svg>'
  };
  function badgesEl(raw){
    if (P.badges !== '1' || !raw) return null;
    var wrap = el('span', 'badges'), seen = {};
    raw.split(',').forEach(function(b){
      var k = b.split('/')[0];
      if (k === 'founder') k = 'subscriber';
      if (k === 'artist-badge') k = 'artist';
      if (!ICONS[k] || seen[k]) return;
      seen[k] = 1;
      var s = el('span', 'badge b-' + k);
      s.innerHTML = ICONS[k]; // SVG constant défini ci-dessus, jamais du contenu du tchat
      wrap.appendChild(s);
    });
    return wrap.childNodes.length ? wrap : null;
  }

  // ---------- Texte + emotes ----------
  function emoteImg(src, alt){ var i = el('img', 'emote'); i.src = src; i.alt = alt; i.loading = 'eager'; return i; }

  function addWords(parent, text, counter){
    if (P.emotes3 !== '1'){ parent.appendChild(document.createTextNode(text)); counter.text = counter.text || /\S/.test(text); return; }
    var parts = text.split(/(\s+)/), buf = '';
    parts.forEach(function(w){
      if (w && thirdParty[w]){
        if (buf){ parent.appendChild(document.createTextNode(buf)); if (/\S/.test(buf)) counter.text = true; buf = ''; }
        parent.appendChild(emoteImg(thirdParty[w], w)); counter.emotes++;
      } else buf += w;
    });
    if (buf){ parent.appendChild(document.createTextNode(buf)); if (/\S/.test(buf)) counter.text = true; }
  }

  // emotesTag : format Twitch "25:0-4,12-16/1902:6-10" (positions en caractères Unicode)
  function textEl(text, emotesTag){
    var span = el('span', 'text');
    var chars = Array.from(text);
    var ranges = [];
    if (emotesTag){
      emotesTag.split('/').forEach(function(part){
        var bits = part.split(':'); if (bits.length < 2) return;
        bits[1].split(',').forEach(function(r){
          var ab = r.split('-'); ranges.push({ id: bits[0], a: +ab[0], b: +ab[1] });
        });
      });
      ranges.sort(function(x, y){ return x.a - y.a; });
    }
    var counter = { emotes: 0, text: false }, pos = 0;
    ranges.forEach(function(r){
      if (r.a < pos) return;
      if (r.a > pos) addWords(span, chars.slice(pos, r.a).join(''), counter);
      var name = chars.slice(r.a, r.b + 1).join('');
      span.appendChild(emoteImg('https://static-cdn.jtvnw.net/emoticons/v2/' + encodeURIComponent(r.id) + '/default/dark/2.0', name));
      counter.emotes++;
      pos = r.b + 1;
    });
    if (pos < chars.length) addWords(span, chars.slice(pos).join(''), counter);
    return { node: span, emoteOnly: counter.emotes > 0 && counter.emotes <= 4 && !counter.text };
  }

  // ---------- Affichage d'un message ----------
  function show(m){
    // m = { id, login, name, color, badges, text, emotes, action, event, sys }
    var div = el('div', 'msg');
    if (m.id) div.dataset.id = m.id;
    if (m.uid) div.dataset.uid = m.uid;
    var col = nameColor(m.color, m.login || '');
    div.style.setProperty('--name-color', col);

    if (m.event){
      div.classList.add('event');
      var sys = el('span', 'sys'); sys.textContent = m.sys; div.appendChild(sys);
      if (m.text){ var t = textEl(m.text, m.emotes); div.appendChild(t.node); }
    } else {
      var meta = el('span', 'meta');
      var b = badgesEl(m.badges); if (b) meta.appendChild(b);
      var name = el('span', 'name'); name.textContent = m.name; name.style.color = col;
      meta.appendChild(name);
      if (!m.action && P.theme !== 'card'){ var colon = document.createTextNode(P.theme === 'clean' ? ':' : ''); name.appendChild(colon); }
      div.appendChild(meta);
      var tx = textEl(m.text, m.emotes);
      if (tx.emoteOnly) div.classList.add('emote-only');
      if (m.action) div.classList.add('action');
      div.appendChild(tx.node);
    }

    chatEl.appendChild(div);
    trim();

    var fade = num(P.fade, 0, 600, 0);
    if (fade > 0) setTimeout(function(){ removeMsg(div); }, fade * 1000);
  }

  function removeMsg(div){
    if (!div.parentNode || div.classList.contains('out')) return;
    div.classList.add('out');
    setTimeout(function(){ div.remove(); }, 520);
  }

  function trim(){
    var max = num(P.max, 1, 50, 12);
    var live = chatEl.querySelectorAll('.msg:not(.out)');
    for (var i = 0; i < live.length - max; i++) live[i].remove();
    // Ce qui est sorti par le haut de l'écran ne se voit plus : on le retire
    // (avec justify-content: flex-end, ce débordement n'apparaît pas dans scrollHeight)
    var first = chatEl.firstElementChild;
    while (first && chatEl.children.length > 1 && first.offsetTop + first.offsetHeight <= 0){ first.remove(); first = chatEl.firstElementChild; }
  }

  // ---------- IRC Twitch ----------
  function unescapeTag(v){
    return v.replace(/\\(.)/g, function(_, c){ return { s: ' ', ':': ';', '\\': '\\', r: '\r', n: '\n' }[c] || c; });
  }
  function parse(line){
    var m = { tags: {}, prefix: '', cmd: '', params: [] }, i = 0;
    if (line[0] === '@'){
      i = line.indexOf(' ');
      line.slice(1, i).split(';').forEach(function(kv){
        var eq = kv.indexOf('='); m.tags[kv.slice(0, eq)] = unescapeTag(kv.slice(eq + 1));
      });
      line = line.slice(i + 1);
    }
    if (line[0] === ':'){ i = line.indexOf(' '); m.prefix = line.slice(1, i); line = line.slice(i + 1); }
    var trail = line.indexOf(' :');
    var head = trail >= 0 ? line.slice(0, trail) : line;
    m.params = head.split(' ').filter(Boolean);
    m.cmd = m.params.shift() || '';
    if (trail >= 0) m.params.push(line.slice(trail + 2));
    return m;
  }

  var ws = null, wsChannel = '', retry = 0, retryTimer = null, roomTimer = null;

  function connect(ch){
    disconnect();
    wsChannel = ch;
    if (!ch) return;
    tellParent('connecting', { channel: ch });
    try { ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443'); } catch(e){ return scheduleRetry(); }
    var sock = ws;
    sock.onopen = function(){
      sock.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
      sock.send('PASS SCHMOOPIIE');
      sock.send('NICK justinfan' + (10000 + Math.floor(Math.random() * 80000)));
      sock.send('JOIN #' + ch);
      clearTimeout(roomTimer);
      roomTimer = setTimeout(function(){ tellParent('notfound', { channel: ch }); }, 6000);
    };
    sock.onmessage = function(e){
      String(e.data).split('\r\n').forEach(function(line){ if (line) handle(parse(line), sock); });
    };
    sock.onclose = function(){ if (sock === ws){ ws = null; scheduleRetry(); } };
    sock.onerror = function(){ try { sock.close(); } catch(e){} };
  }
  function disconnect(){
    clearTimeout(retryTimer); clearTimeout(roomTimer);
    if (ws){ var s = ws; ws = null; try { s.close(); } catch(e){} }
  }
  function scheduleRetry(){
    if (!wsChannel) return;
    tellParent('retry', { channel: wsChannel });
    retry = Math.min(retry + 1, 6);
    retryTimer = setTimeout(function(){ connect(wsChannel); }, 1000 * Math.pow(2, retry - 1));
  }

  function handle(m, sock){
    switch (m.cmd){
      case 'PING': sock.send('PONG :' + (m.params[0] || 'tmi.twitch.tv')); break;
      case 'ROOMSTATE':
        if (m.tags['room-id']){
          retry = 0; clearTimeout(roomTimer);
          tellParent('connected', { channel: wsChannel });
          loadChannelEmotes(m.tags['room-id']);
        }
        break;
      case 'PRIVMSG': {
        var login = m.prefix.split('!')[0].toLowerCase();
        var text = m.params[1] || '';
        if (hidden[login]) return;
        var action = false;
        var me = /^\u0001ACTION (.*)\u0001$/.exec(text);
        if (me){ text = me[1]; action = true; }
        if (P.hidecmd === '1' && text.charAt(0) === '!') return;
        show({ id: m.tags.id, uid: m.tags['user-id'], login: login, name: m.tags['display-name'] || login,
               color: m.tags.color, badges: m.tags.badges, text: text, emotes: m.tags.emotes, action: action });
        break;
      }
      case 'USERNOTICE': {
        if (P.events !== '1') return;
        var sys = m.tags['system-msg'] || '';
        if (m.tags['msg-id'] === 'announcement') sys = '📣 ' + (m.tags['display-name'] || '');
        if (!sys) return;
        show({ event: true, sys: sys, text: m.params[1] || '', emotes: m.tags.emotes, login: m.tags.login || '', color: m.tags.color });
        break;
      }
      case 'CLEARMSG': {
        var id = m.tags['target-msg-id'];
        chatEl.querySelectorAll('.msg').forEach(function(d){ if (d.dataset.id === id) d.remove(); });
        break;
      }
      case 'CLEARCHAT': {
        var uid = m.tags['target-user-id'];
        chatEl.querySelectorAll('.msg').forEach(function(d){ if (!uid || d.dataset.uid === uid) d.remove(); });
        break;
      }
      case 'RECONNECT': try { sock.close(); } catch(e){} break;
    }
  }

  // ---------- Emotes 7TV / BTTV / FFZ ----------
  var globalsLoaded = false, loadedRoom = '';
  function getJSON(url){ return fetch(url).then(function(r){ if (!r.ok) throw r.status; return r.json(); }); }
  function add(map, name, url){ if (name && url && !map[name]) map[name] = url; }

  function from7tv(list, map){
    (list || []).forEach(function(e){
      var h = e.data && e.data.host; if (!h || !h.url) return;
      add(map, e.name, (h.url.indexOf('//') === 0 ? 'https:' : '') + h.url + '/2x.webp');
    });
  }
  function fromBttv(list, map){ (list || []).forEach(function(e){ add(map, e.code, 'https://cdn.betterttv.net/emote/' + e.id + '/2x'); }); }
  function fromFfz(sets, map){
    Object.keys(sets || {}).forEach(function(k){
      (sets[k].emoticons || []).forEach(function(e){
        var u = e.urls && (e.urls['2'] || e.urls['1']); if (!u) return;
        add(map, e.name, u.indexOf('//') === 0 ? 'https:' + u : u);
      });
    });
  }

  // Ordre de priorité : chaîne avant global, 7TV > BTTV > FFZ
  var layers = { c7: {}, cb: {}, cf: {}, g7: {}, gb: {}, gf: {} };
  function rebuild(){
    var out = {};
    ['c7', 'cb', 'cf', 'g7', 'gb', 'gf'].forEach(function(k){ Object.keys(layers[k]).forEach(function(n){ if (!out[n]) out[n] = layers[k][n]; }); });
    thirdParty = out;
  }
  function loadGlobals(){
    if (globalsLoaded || P.emotes3 !== '1') return;
    globalsLoaded = true;
    getJSON('https://7tv.io/v3/emote-sets/global').then(function(d){ from7tv(d.emotes, layers.g7); rebuild(); }).catch(function(){});
    getJSON('https://api.betterttv.net/3/cached/emotes/global').then(function(d){ fromBttv(d, layers.gb); rebuild(); }).catch(function(){});
    getJSON('https://api.frankerfacez.com/v1/set/global').then(function(d){
      var sets = {}; (d.default_sets || []).forEach(function(id){ if (d.sets[id]) sets[id] = d.sets[id]; });
      fromFfz(sets, layers.gf); rebuild();
    }).catch(function(){});
  }
  function loadChannelEmotes(roomId){
    if (P.emotes3 !== '1' || roomId === loadedRoom) return;
    loadedRoom = roomId;
    layers.c7 = {}; layers.cb = {}; layers.cf = {};
    getJSON('https://7tv.io/v3/users/twitch/' + roomId).then(function(d){ from7tv(d.emote_set && d.emote_set.emotes, layers.c7); rebuild(); }).catch(function(){});
    getJSON('https://api.betterttv.net/3/cached/users/twitch/' + roomId).then(function(d){ fromBttv((d.channelEmotes || []).concat(d.sharedEmotes || []), layers.cb); rebuild(); }).catch(function(){});
    getJSON('https://api.frankerfacez.com/v1/room/id/' + roomId).then(function(d){ fromFfz(d.sets, layers.cf); rebuild(); }).catch(function(){});
  }

  // ---------- Mode démo (aperçu de l'éditeur) ----------
  var DEMO_EMOTES = { Kappa: '25', LUL: '425618', HeyGuys: '30259', SeemsGood: '64138', '<3': '9', VoHiYo: '81274', NotLikeThis: '58765', BibleThump: '86' };
  var DEMO_USERS = [
    { n: 'Lunaa_', c: '#ff69b4', b: 'subscriber/12' }, { n: 'KevGaming', c: '#1e90ff', b: '' },
    { n: 'Mamie_Gameuse', c: '#9acd32', b: 'moderator/1,subscriber/24' }, { n: 'xXDarkSasukeXx', c: '#0000ff', b: '' },
    { n: 'Choupette', c: '#ff7f50', b: 'vip/1' }, { n: 'Tonton_Raclette', c: '', b: 'subscriber/3' },
    { n: 'PixelPaulo', c: '#00ff7f', b: '' }, { n: 'Nightbot', c: '#7c7cff', b: 'moderator/1', bot: true }
  ];
  var DEMO_MSGS = [
    'Salut tout le monde HeyGuys', 'GG !!! LUL', 'mais non il a raté le saut LUL LUL', 'Kappa',
    'Trop beau le nouveau cadre <3', 'tu joues à quoi après ?', 'Première fois que je passe ici, ça a l\'air cool',
    'NotLikeThis NotLikeThis', 'c\'est quoi ta config ?', 'SeemsGood', 'allez on y croit !!', 'BibleThump il est mort',
    'la musique est trop bien', 'VoHiYo', 'bonne soirée à tous <3', 'jsuis sûr il va réussir cette fois Kappa'
  ];
  var demoTimer = null, demoCount = 0;
  function demoEmotesTag(text){
    var chars = Array.from(text), map = {}, pos = 0;
    text.split(' ').forEach(function(w){
      var len = Array.from(w).length;
      if (DEMO_EMOTES[w]){ (map[DEMO_EMOTES[w]] = map[DEMO_EMOTES[w]] || []).push(pos + '-' + (pos + len - 1)); }
      pos += len + 1;
    });
    return Object.keys(map).map(function(id){ return id + ':' + map[id].join(','); }).join('/');
  }
  function demoTick(){
    demoCount++;
    if (P.events === '1' && demoCount % 9 === 0){
      show({ event: true, sys: 'Choupette s\'est abonné(e) au niveau 1. Ça fait 6 mois d\'affilée !', text: 'Toujours là <3', emotes: demoEmotesTag('Toujours là <3'), login: 'choupette' });
    } else {
      var u = DEMO_USERS[Math.floor(Math.random() * DEMO_USERS.length)];
      var text = u.bot ? '!discord → rejoins le serveur ici' : DEMO_MSGS[Math.floor(Math.random() * DEMO_MSGS.length)];
      if (!(u.bot && hidden.nightbot) && !(P.hidecmd === '1' && text[0] === '!')){
        var action = !u.bot && Math.random() < .04;
        show({ id: 'd' + demoCount, login: u.n.toLowerCase(), name: u.n, color: u.c, badges: u.b, text: text, emotes: demoEmotesTag(text), action: action });
      }
    }
    demoTimer = setTimeout(demoTick, 900 + Math.random() * 1600);
  }
  function startDemo(){ stopDemo(); for (var i = 0; i < 5; i++) { demoTick(); clearTimeout(demoTimer); } demoTimer = setTimeout(demoTick, 1200); }
  function stopDemo(){ clearTimeout(demoTimer); demoTimer = null; }

  // ---------- Application des réglages ----------
  var loadedFonts = {};
  function render(raw){
    var prev = P;
    P = Object.assign({}, DEFAULTS, raw || {});
    var ch = String(P.ch || '').toLowerCase().replace(/^#/, '').replace(/[^a-z0-9_]/g, '').slice(0, 25);
    P.ch = ch;

    var f = FONTS[P.font] || FONTS.grotesk;
    if (f.g && !loadedFonts[P.font]){
      loadedFonts[P.font] = 1;
      var l = document.createElement('link'); l.rel = 'stylesheet';
      l.href = 'https://fonts.googleapis.com/css2?family=' + f.g + '&display=swap';
      document.head.appendChild(l);
    }
    var root = document.documentElement.style;
    root.setProperty('--font', f.css + ', system-ui, sans-serif');
    root.setProperty('--fs', num(P.fs, 10, 72, 20) + 'px');
    var ac = hex(P.ac, DEFAULTS.ac);
    root.setProperty('--ac', ac);
    var n = parseInt(ac.slice(1), 16);
    // Fond des bulles : très sombre, teinté par la couleur d'accent
    var r = (n >> 16 & 255) * .12 + 10, g = (n >> 8 & 255) * .12 + 9, b = (n & 255) * .12 + 16;
    root.setProperty('--bg', 'rgba(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ',' + num(P.bgo, 0, 100, 70) / 100 + ')');

    var theme = /^(bubble|clean|neon|card)$/.test(P.theme) ? P.theme : 'bubble';
    var anim = /^(slide|fade|pop|none)$/.test(P.anim) ? P.anim : 'slide';
    document.body.className = ['t-' + theme, 'a-' + anim, P.align === 'right' ? 'right' : 'left'].join(' ');

    hidden = {};
    String(P.bots || '').toLowerCase().split(/[\s,;]+/).forEach(function(b){ if (b) hidden[b.replace(/^@/, '')] = 1; });

    trim();
    loadGlobals();

    var sourceChanged = prev.ch !== P.ch || prev.demo !== P.demo || (prev.emotes3 !== P.emotes3);
    if (sourceChanged){
      chatEl.textContent = '';
      if (P.demo === '1'){ disconnect(); wsChannel = ''; startDemo(); tellParent('demo'); }
      else { stopDemo(); loadedRoom = ''; if (ch) connect(ch); else { disconnect(); wsChannel = ''; tellParent('idle'); } }
    }
  }

  var params = {};
  new URLSearchParams(location.search).forEach(function(v, k){ params[k] = v; });
  render(params);

  window.addEventListener('message', function(e){
    if (e.origin !== location.origin || !e.data || e.data.type !== 'sk-params') return;
    render(e.data.params);
  });
})();
</script>
